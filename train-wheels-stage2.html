<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Wheels - Stage 2: Four Wheels</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            font-size: 16px;
            text-shadow: 1px 1px 2px black;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            color: white;
            font-size: 12px;
            max-width: 280px;
        }
        .control-group {
            margin-bottom: 10px;
            padding: 5px;
            border-bottom: 1px solid #444;
        }
        .control-group h3 {
            margin: 5px 0;
            color: #4a90e2;
        }
        .axis-label {
            position: absolute;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 5px 10px;
            margin: 2px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #357abd;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        input[type="range"] {
            width: 100px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="info">Train Wheels - Stage 2: Four Wheels and Chassis</div>
    <div id="controls">
        <div class="control-group">
            <h3>Train Controls</h3>
            <div>
                <button id="toggleAnimation">Pause Animation</button>
                <button id="resetView">Reset View</button>
            </div>
            <div style="margin-top: 5px;">
                Speed: <input type="range" id="speedControl" min="0.1" max="5" step="0.1" value="1">
                <span id="speedValue">1.0x</span>
            </div>
        </div>
        <div class="control-group">
            <h3>Wheel Presets</h3>
            <div>
                <button id="presetDefault">Default</button>
                <button id="presetWide">Wide Gauge</button>
                <button id="presetNarrow">Narrow Gauge</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2c3e50);
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 5, 8);
        camera.lookAt(0, 1, 0);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // Track parameters
        const trackWidth = 1.5;
        const trackLength = 20;
        const railHeight = 0.1;
        
        // Create track
        function createTrack() {
            const trackGroup = new THREE.Group();
            
            // Track bed
            const trackBedGeometry = new THREE.BoxGeometry(trackLength, 0.1, trackWidth * 3);
            const trackBedMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.8,
                metalness: 0.2
            });
            const trackBed = new THREE.Mesh(trackBedGeometry, trackBedMaterial);
            trackBed.position.y = -0.05; // Slightly below ground
            trackBed.receiveShadow = true;
            trackGroup.add(trackBed);
            
            // Rails
            const railGeometry = new THREE.BoxGeometry(trackLength, railHeight, 0.1);
            const railMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x888888,
                roughness: 0.3,
                metalness: 0.7
            });
            
            // Left rail
            const leftRail = new THREE.Mesh(railGeometry, railMaterial);
            leftRail.position.set(0, railHeight/2, -trackWidth/2);
            leftRail.castShadow = true;
            leftRail.receiveShadow = true;
            trackGroup.add(leftRail);
            
            // Right rail
            const rightRail = new THREE.Mesh(railGeometry, railMaterial);
            rightRail.position.set(0, railHeight/2, trackWidth/2);
            rightRail.castShadow = true;
            rightRail.receiveShadow = true;
            trackGroup.add(rightRail);
            
            // Ties
            const tieGeometry = new THREE.BoxGeometry(0.2, 0.1, trackWidth * 1.5);
            const tieMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x5d4037,
                roughness: 0.9,
                metalness: 0.1
            });
            
            for (let i = -trackLength/2 + 0.5; i < trackLength/2; i += 0.5) {
                const tie = new THREE.Mesh(tieGeometry, tieMaterial);
                tie.position.set(i, 0, 0);
                tie.castShadow = true;
                tie.receiveShadow = true;
                trackGroup.add(tie);
            }
            
            return trackGroup;
        }
        
        // Create a wheel
        function createWheel() {
            const wheelGroup = new THREE.Group();
            
            // Wheel parameters
            const wheelRadius = 0.5;
            const wheelWidth = 0.2;
            const wheelSegments = 32;
            
            // Wheel geometry
            const wheelGeometry = new THREE.CylinderGeometry(
                wheelRadius, wheelRadius, wheelWidth, wheelSegments
            );
            
            // Wheel material
            const wheelMaterial = new THREE.MeshStandardMaterial({
                color: 0x333333,
                roughness: 0.7,
                metalness: 0.3
            });
            
            // Create the wheel mesh
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2; // Rotate to stand upright
            wheel.castShadow = true;
            wheel.receiveShadow = true;
            
            // Add visual markings to the wheel
            const markingsGeometry = new THREE.CylinderGeometry(
                wheelRadius * 0.95,
                wheelRadius * 0.95,
                wheelWidth * 1.1,
                wheelSegments,
                1,
                true
            );
            
            const markingsMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.5
            });
            
            const wheelMarkings = new THREE.Mesh(markingsGeometry, markingsMaterial);
            wheelMarkings.rotation.z = Math.PI / 2;
            wheelGroup.add(wheelMarkings);
            
            // Add colored stripes to the wheel
            const stripeCount = 8;
            const stripeMaterial = new THREE.MeshBasicMaterial({
                side: THREE.DoubleSide
            });
            
            for (let i = 0; i < stripeCount; i++) {
                const angle = (i / stripeCount) * Math.PI * 2;
                const stripe = new THREE.Mesh(
                    new THREE.BoxGeometry(wheelRadius * 1.1, wheelWidth * 1.2, 0.1),
                    stripeMaterial
                );
                stripe.position.set(
                    Math.cos(angle) * wheelRadius * 0.5,
                    0,
                    Math.sin(angle) * wheelRadius * 0.5
                );
                stripe.lookAt(new THREE.Vector3(0, 1, 0));
                stripe.material.color.setHex(i % 2 === 0 ? 0xff0000 : 0xffff00);
                wheelGroup.add(stripe);
            }
            
            // Add the main wheel last so it renders on top
            wheelGroup.add(wheel);
            
            // Add axle
            const axleGeometry = new THREE.CylinderGeometry(
                0.05, 0.05, wheelWidth * 1.2, 16
            );
            const axleMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff0000,
                transparent: true,
                opacity: 0.7
            });
            const axle = new THREE.Mesh(axleGeometry, axleMaterial);
            wheelGroup.add(axxle);
            
            return { wheelGroup, wheel, wheelRadius };
        }
        
        // Create train chassis
        function createChassis() {
            const chassisGroup = new THREE.Group();
            
            // Main body
            const bodyGeometry = new THREE.BoxGeometry(3, 1, 1.5);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c3e50,
                roughness: 0.7,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.75;
            body.castShadow = true;
            body.receiveShadow = true;
            chassisGroup.add(body);
            
            // Cabin
            const cabinGeometry = new THREE.BoxGeometry(1.5, 0.8, 1.2);
            const cabinMaterial = new THREE.MeshStandardMaterial({
                color: 0x34495e,
                roughness: 0.5,
                metalness: 0.5
            });
            const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
            cabin.position.set(0.5, 1.4, 0);
            cabin.castShadow = true;
            chassisGroup.add(cabin);
            
            return chassisGroup;
        }
        
        // Create track and add to scene
        const track = createTrack();
        scene.add(track);
        
        // Create wheels
        const wheels = [];
        const wheelPositions = [
            { x: -1, y: 0.5, z: -0.75 },
            { x: 1, y: 0.5, z: -0.75 },
            { x: -1, y: 0.5, z: 0.75 },
            { x: 1, y: 0.5, z: 0.75 }
        ];
        
        wheelPositions.forEach(pos => {
            const { wheelGroup, wheel, wheelRadius } = createWheel();
            wheelGroup.position.set(pos.x, pos.y, pos.z);
            wheels.push({ group: wheelGroup, mesh: wheel, radius: wheelRadius });
            scene.add(wheelGroup);
        });
        
        // Create chassis and add to scene
        const chassis = createChassis();
        scene.add(chassis);
        
        // Animation variables
        let animationSpeed = 1;
        let isAnimating = true;
        let distance = 0;
        
        // UI Controls
        document.getElementById('toggleAnimation').addEventListener('click', () => {
            isAnimating = !isAnimating;
            const btn = document.getElementById('toggleAnimation');
            btn.textContent = isAnimating ? 'Pause Animation' : 'Play Animation';
        });
        
        document.getElementById('resetView').addEventListener('click', () => {
            camera.position.set(8, 5, 8);
            camera.lookAt(0, 1, 0);
        });
        
        document.getElementById('speedControl').addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = animationSpeed.toFixed(1) + 'x';
        });
        
        // Preset buttons
        document.getElementById('presetDefault').addEventListener('click', () => {
            // Default positions
            wheelPositions.forEach((pos, i) => {
                wheels[i].group.position.set(pos.x, pos.y, pos.z);
            });
        });
        
        document.getElementById('presetWide').addEventListener('click', () => {
            // Wider gauge
            wheelPositions.forEach((pos, i) => {
                wheels[i].group.position.set(pos.x, pos.y, pos.z * 1.5);
            });
        });
        
        document.getElementById('presetNarrow').addEventListener('click', () => {
            // Narrower gauge
            wheelPositions.forEach((pos, i) => {
                wheels[i].group.position.set(pos.x, pos.y, pos.z * 0.7);
            });
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            if (isAnimating) {
                // Update wheel rotation based on speed and wheel radius
                const rotationSpeed = 0.02 * animationSpeed;
                distance += rotationSpeed;
                
                wheels.forEach(wheelData => {
                    wheelData.mesh.rotation.y = -distance / wheelData.radius;
                });
                
                // Move chassis slightly to simulate movement
                chassis.position.x = Math.sin(distance * 0.5) * 0.1;
            }
            
            renderer.render(scene, camera);
        }
        
        // Start animation
        animate();
    </script>
</body>
</html>
