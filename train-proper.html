<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Simulator - Proper Implementation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a1a; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px;
            font-family: monospace;
            z-index: 100;
        }
        #debug { 
            position: absolute; bottom: 10px; left: 10px;
            color: white; font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 3px;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 5px 10px;
            margin: 5px 2px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        input[type="range"] { width: 100px; margin: 0 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <div>Speed: <input type="range" id="speed" min="-10" max="10" step="0.1" value="0">
        <span id="speedValue">0.0</span></div>
        <div>Track Radius: <input type="range" id="trackRadius" min="10" max="30" step="1" value="15">
        <span id="radiusValue">15</span>m</div>
        <button id="addCar">Add Car</button>
        <button id="reset">Reset</button>
    </div>
    <div id="debug">Ready</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // --- Constants ---
        const WHEEL_RADIUS = 0.5;
        const WHEEL_THICKNESS = 0.2;
        const CAR_LENGTH = 3;
        const COUPLING_DISTANCE = 0.5;
        const TRACK_WIDTH = 2;
        const RAIL_RADIUS = 0.2;
        const MAX_CARS = 5;

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 30);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Lighting
        function setupLighting() {
            const ambient = new THREE.AmbientLight(0x404040, 0.8);
            scene.add(ambient);
            
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);
            
            // Add a fill light from below
            const fill = new THREE.HemisphereLight(0x404040, 0x202020, 0.5);
            scene.add(fill);
        }

        // --- Track System ---
        function createTrack(radius) {
            // Clear existing track
            scene.children = scene.children.filter(obj => !obj.userData.isTrack);
            
            // Create circular path for train
            const points = [];
            const segments = 64;
            
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(
                    Math.cos(angle) * radius,
                    0,
                    Math.sin(angle) * radius
                ));
            }
            
            // Create smooth curve using Catmull-Rom
            const curve = new THREE.CatmullRomCurve3(points, true);
            const curveLength = curve.getLength();
            
            // Create visual track
            createTrackVisuals(curve, radius);
            
            return { curve, length: curveLength };
        }
        
        function createTrackVisuals(curve, radius) {
            // Rails
            const railGeometry = new THREE.TorusGeometry(radius, RAIL_RADIUS, 8, 64);
            railGeometry.rotateX(-Math.PI / 2);
            
            const railMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x555555,
                roughness: 0.8,
                metalness: 0.2
            });
            
            // Inner rail
            const innerRail = new THREE.Mesh(railGeometry, railMaterial);
            innerRail.position.y = 0.1;
            innerRail.userData.isTrack = true;
            scene.add(innerRail);
            
            // Outer rail
            const outerRail = new THREE.Mesh(railGeometry, railMaterial);
            outerRail.position.y = 0.1;
            outerRail.scale.set(1.1, 1, 1.1);
            outerRail.userData.isTrack = true;
            scene.add(outerRail);
            
            // Sleepers
            const sleeperGeometry = new THREE.BoxGeometry(2, 0.1, 0.5);
            const sleeperMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x5D4037,
                roughness: 0.9
            });
            
            const numSleepers = 60;
            for (let i = 0; i < numSleepers; i++) {
                const t = i / numSleepers;
                const point = curve.getPoint(t);
                const tangent = curve.getTangent(t).normalize();
                
                const sleeper = new THREE.Mesh(sleeperGeometry, sleeperMaterial);
                sleeper.position.copy(point);
                sleeper.position.y = 0.05;
                sleeper.rotation.y = Math.atan2(tangent.x, tangent.z);
                sleeper.userData.isTrack = true;
                sleeper.castShadow = true;
                sleeper.receiveShadow = true;
                scene.add(sleeper);
            }
        }

        // --- Train System ---
        function createWheel() {
            const wheel = new THREE.Group();
            
            const geometry = new THREE.CylinderGeometry(
                WHEEL_RADIUS, WHEEL_RADIUS, WHEEL_THICKNESS, 16
            );
            geometry.rotateZ(Math.PI / 2); // Rotate to align with X-axis
            
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.7,
                metalness: 0.3
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            wheel.add(mesh);
            
            return wheel;
        }
        
        function createBogie(isFront = true) {
            const bogie = new THREE.Group();
            
            // Bogie frame
            const frameGeometry = new THREE.BoxGeometry(1, 0.2, 1);
            const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.castShadow = true;
            frame.receiveShadow = true;
            bogie.add(frame);
            
            // Wheels
            const wheelPositions = [
                { x: -0.6, y: -0.2, z: 0.6 },
                { x: 0.6, y: -0.2, z: 0.6 },
                { x: -0.6, y: -0.2, z: -0.6 },
                { x: 0.6, y: -0.2, z: -0.6 }
            ];
            
            const wheels = [];
            wheelPositions.forEach(pos => {
                const wheel = createWheel();
                wheel.position.set(pos.x, pos.y, pos.z);
                wheel.rotation.z = isFront ? 0 : Math.PI; // Flip wheels on rear bogie
                bogie.add(wheel);
                wheels.push(wheel);
            });
            
            bogie.userData.wheels = wheels;
            return bogie;
        }
        
        function createCar(isLocomotive = false) {
            const car = new THREE.Group();
            
            // Car body
            const bodyLength = CAR_LENGTH;
            const bodyGeometry = new THREE.BoxGeometry(bodyLength, 1, 2);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: isLocomotive ? 0x4CAF50 : 0x2196F3,
                roughness: 0.7,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.5;
            body.castShadow = true;
            body.receiveShadow = true;
            car.add(body);
            
            // Add bogies
            const frontBogie = createBogie(true);
            frontBogie.position.set(bodyLength * 0.3, 0, 0);
            car.add(frontBogie);
            
            const rearBogie = createBogie(false);
            rearBogie.position.set(-bodyLength * 0.3, 0, 0);
            car.add(rearBogie);
            
            // Add couplers
            const couplerGeometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const couplerMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            const frontCoupler = new THREE.Mesh(couplerGeometry, couplerMaterial);
            frontCoupler.position.set(bodyLength * 0.5, 0.1, 0);
            car.add(frontCoupler);
            
            const rearCoupler = new THREE.Mesh(couplerGeometry, couplerMaterial);
            rearCoupler.position.set(-bodyLength * 0.5, 0.1, 0);
            car.add(rearCoupler);
            
            // Position the car
            car.position.y = WHEEL_RADIUS + 0.1;
            
            // Store car data
            car.userData = {
                isLocomotive,
                frontBogie,
                rearBogie,
                frontCoupler,
                rearCoupler,
                distance: 0,  // Distance along track
                speed: 0,
                targetSpeed: 0,
                length: bodyLength
            };
            
            return car;
        }
        
        // --- Train Management ---
        class TrainSystem {
            constructor() {
                this.cars = [];
                this.trackRadius = 15;
                this.track = null;
                this.clock = new THREE.Clock();
                this.init();
            }
            
            init() {
                this.track = createTrack(this.trackRadius);
                this.addCar(true); // Add locomotive
                
                // Position camera to look at the track
                camera.lookAt(0, 0, 0);
                
                // Start animation
                this.animate();
            }
            
            addCar(isLocomotive = false) {
                if (this.cars.length >= MAX_CARS) return null;
                
                const car = createCar(isLocomotive);
                
                if (this.cars.length > 0) {
                    // Position new car behind the last car
                    const lastCar = this.cars[this.cars.length - 1];
                    const offset = lastCar.userData.length / 2 + car.userData.length / 2 + COUPLING_DISTANCE;
                    car.userData.distance = (lastCar.userData.distance - offset + this.track.length) % this.track.length;
                } else {
                    // First car starts at distance 0
                    car.userData.distance = 0;
                }
                
                this.updateCarPosition(car, 0);
                this.cars.push(car);
                scene.add(car);
                
                return car;
            }
            
            updateCarPosition(car, deltaTime) {
                const data = car.userData;
                
                // Update speed with smooth acceleration
                data.speed += (data.targetSpeed - data.speed) * 0.1;
                
                // Update position along track
                data.distance = (data.distance + data.speed * deltaTime + this.track.length) % this.track.length;
                
                // Get position and tangent at current distance
                const t = this.track.curve.getUtoTmapping(data.distance / this.track.length);
                const position = this.track.curve.getPoint(t);
                const tangent = this.track.curve.getTangent(t);
                
                // Calculate normal (up vector)
                const normal = new THREE.Vector3(0, 1, 0);
                
                // Calculate binormal (side vector)
                const binormal = new THREE.Vector3();
                binormal.crossVectors(tangent, normal).normalize();
                
                // Recalculate normal to be perpendicular to both tangent and binormal
                normal.crossVectors(binormal, tangent).normalize();
                
                // Create rotation matrix from tangent, normal, binormal
                const rotationMatrix = new THREE.Matrix4();
                rotationMatrix.makeBasis(
                    binormal,
                    normal,
                    tangent.clone().negate() // Negate tangent to point train forward
                );
                
                // Apply banking based on curve
                const curvature = this.calculateCurvature(t);
                const bankAngle = curvature * 5; // Scale factor for visual effect
                
                // Apply banking as a local rotation around the forward axis
                const bankQuaternion = new THREE.Quaternion()
                    .setFromAxisAngle(new THREE.Vector3(0, 0, 1), bankAngle);
                
                // Combine rotations
                const quaternion = new THREE.Quaternion()
                    .setFromRotationMatrix(rotationMatrix)
                    .multiply(bankQuaternion);
                
                // Apply position and rotation
                car.position.copy(position);
                car.quaternion.copy(quaternion);
                
                // Update wheel rotations
                this.updateWheels(car, deltaTime);
                
                return position;
            }
            
            calculateCurvature(t) {
                // Sample points around t to estimate curvature
                const delta = 0.01;
                const t1 = (t - delta + 1) % 1;
                const t2 = (t + delta) % 1;
                
                const p1 = this.track.curve.getPoint(t1);
                const p2 = this.track.curve.getPoint(t);
                const p3 = this.track.curve.getPoint(t2);
                
                // Calculate vectors between points
                const v1 = new THREE.Vector3().subVectors(p2, p1);
                const v2 = new THREE.Vector3().subVectors(p3, p2);
                
                // Calculate angle between vectors
                const angle = v1.angleTo(v2);
                
                // Return signed curvature (positive for left turns, negative for right)
                const cross = new THREE.Vector3().crossVectors(v1, v2);
                return cross.y < 0 ? -angle : angle;
            }
            
            updateWheels(car, deltaTime) {
                const data = car.userData;
                const speed = data.speed;
                
                // Rotate wheels based on speed
                const rotation = (speed / WHEEL_RADIUS) * deltaTime;
                
                // Update front bogie wheels
                data.frontBogie.userData.wheels.forEach(wheel => {
                    wheel.rotation.x += rotation;
                });
                
                // Update rear bogie wheels (reverse rotation)
                data.rearBogie.userData.wheels.forEach(wheel => {
                    wheel.rotation.x -= rotation;
                });
            }
            
            update(deltaTime) {
                if (this.cars.length === 0) return;
                
                // Update each car's position
                for (let i = 0; i < this.cars.length; i++) {
                    const car = this.cars[i];
                    this.updateCarPosition(car, deltaTime);
                }
                
                // Update camera to follow first car
                this.updateCamera();
                
                // Update debug info
                this.updateDebugInfo();
            }
            
            updateCamera() {
                if (this.cars.length === 0) return;
                
                const targetCar = this.cars[0];
                const targetPosition = targetCar.position.clone();
                
                // Calculate camera position behind and above the target car
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(targetCar.quaternion);
                const up = new THREE.Vector3(0, 1, 0);
                
                const cameraDistance = 15;
                const cameraHeight = 10;
                
                const cameraPosition = targetPosition
                    .clone()
                    .add(forward.clone().multiplyScalar(-cameraDistance))
                    .add(up.clone().multiplyScalar(cameraHeight));
                
                // Smooth camera movement
                camera.position.lerp(cameraPosition, 0.1);
                camera.lookAt(targetPosition);
            }
            
            updateDebugInfo() {
                if (this.cars.length === 0) return;
                
                const loco = this.cars[0].userData;
                document.getElementById('debug').textContent = 
                    `Speed: ${loco.speed.toFixed(2)} m/s | ` +
                    `Cars: ${this.cars.length} | ` +
                    `Track Radius: ${this.trackRadius}m`;
            }
            
            reset() {
                // Remove all cars
                this.cars.forEach(car => scene.remove(car));
                this.cars = [];
                
                // Reset track
                this.track = createTrack(this.trackRadius);
                
                // Add locomotive back
                this.addCar(true);
                
                // Reset speed
                if (this.cars[0]) {
                    this.cars[0].userData.targetSpeed = 0;
                }
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                const deltaTime = Math.min(0.05, this.clock.getDelta());
                
                // Update train
                this.update(deltaTime);
                
                // Render scene
                renderer.render(scene, camera);
            }
        }

        // --- Initialize ---
        function init() {
            // Setup lighting
            setupLighting();
            
            // Create ground
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x3a5f0b,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Create train system
            const trainSystem = new TrainSystem();
            
            // UI Controls
            document.getElementById('speed').addEventListener('input', (e) => {
                const speed = parseFloat(e.target.value) * 0.1;
                document.getElementById('speedValue').textContent = e.target.value;
                if (trainSystem.cars[0]) {
                    trainSystem.cars[0].userData.targetSpeed = speed;
                }
            });
            
            document.getElementById('trackRadius').addEventListener('input', (e) => {
                trainSystem.trackRadius = parseFloat(e.target.value);
                document.getElementById('radiusValue').textContent = e.target.value;
                trainSystem.reset();
            });
            
            document.getElementById('addCar').addEventListener('click', () => {
                trainSystem.addCar();
            });
            
            document.getElementById('reset').addEventListener('click', () => {
                trainSystem.reset();
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        // Start the application
        init();
    </script>
</body>
</html>
