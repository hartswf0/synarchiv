<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iso-Memory Vault</title>
    <style>
        /* General Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', serif; /* Changed font to match image aesthetic */
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            overflow: hidden;
            color: #E9D7BE;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            pointer-events: auto; /* Default: enable 3D interaction */
            transition: pointer-events 0.3s ease-in-out; /* Smooth transition */
        }
        /* Disable 3D interaction when modal or file is open or animating */
        #container.modal-open,
        #container.file-open,
        #container.animating-global { /* New class for blocking interaction */
            pointer-events: none;
        }

        /* UI Overlay for 2D elements */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to pass through to elements within */
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* Specific UI Elements */
        .compass-rose {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(233, 215, 190, 0.1);
            border: 2px solid #E9D7BE;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: all; /* Make it clickable */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            user-select: none;
            -webkit-user-select: none;
        }

        .compass-rose:hover {
            background: rgba(233, 215, 190, 0.2);
            transform: scale(1.1);
        }

        .timeline-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(300px, 60%, 800px);
            height: 60px;
            background: rgba(233, 215, 190, 0.1);
            border: 2px solid #E9D7BE;
            border-radius: 30px;
            pointer-events: all;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.3s ease, pointer-events 0.3s ease;
        }

        .timeline-track {
            width: 100%;
            height: 4px;
            background: rgba(233, 215, 190, 0.3);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .timeline-thumb {
            width: 20px;
            height: 20px;
            background: #E9D7BE;
            border-radius: 50%;
            position: absolute;
            top: -8px;
            left: 0%;
            cursor: grab;
            transition: transform 0.2s ease;
        }

        .timeline-thumb:hover {
            transform: scale(1.2);
        }

        .timeline-thumb:active {
            cursor: grabbing;
        }

        .info-panel {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(233, 215, 190, 0.1);
            border: 2px solid #E9D7BE;
            border-radius: 10px;
            padding: 20px;
            max-width: 300px;
            pointer-events: all;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .info-panel.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .info-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #E9D7BE;
        }

        .info-description {
            font-size: 14px;
            line-height: 1.4;
            color: rgba(233, 215, 190, 0.8);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #E9D7BE;
            user-select: none;
            -webkit-user-select: none;
        }

        .debug-panel {
            position: absolute;
            top: 120px; /* Below compass */
            right: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            font-size: 12px;
            color: #E9D7BE;
            pointer-events: all;
            max-width: 200px;
            opacity: 0;
            transition: opacity 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .debug-panel.visible {
            opacity: 1;
        }

        .debug-item {
            margin: 2px 0;
            font-family: 'Courier New', monospace;
        }

        /* 2D Drawer Modal Styles (for artifacts) */
        #drawer-2d-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(300px, 80%, 700px);
            max-height: 90vh;
            background: rgba(233, 215, 190, 0.15);
            border: 2px solid #E9D7BE;
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            pointer-events: all;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #drawer-2d-modal.visible {
            opacity: 1;
            visibility: visible;
        }

        #drawer-2d-modal h3 {
            font-family: 'Times New Roman', serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 15px;
            color: #E9D7BE;
            text-align: center;
            border-bottom: 1px solid rgba(233, 215, 190, 0.3);
            padding-bottom: 10px;
        }

        #drawer-2d-modal p.drawer-2d-desc {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: rgba(233, 215, 190, 0.9);
            margin-bottom: 25px;
            text-align: center;
        }

        #drawer-2d-artifacts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .artifact-2d-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(233, 215, 190, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s ease, background 0.2s ease;
            cursor: help;
        }

        .artifact-2d-item:hover {
            transform: translateY(-5px);
            background: rgba(0, 0, 0, 0.6);
        }

        .artifact-2d-item .icon {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 10px;
            line-height: 1;
        }

        .artifact-2d-item .name {
            font-family: 'Times New Roman', serif;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            font-weight: bold;
            color: #E9D7BE;
            margin-bottom: 5px;
        }

        .artifact-2d-item .description {
            font-size: clamp(0.6rem, 1.5vw, 0.8rem);
            color: rgba(233, 215, 190, 0.7);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #drawer-2d-close {
            display: block;
            margin: 0 auto;
            padding: 12px 25px;
            background: #E9D7BE;
            color: #2d2d2d;
            border: none;
            border-radius: 8px;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        #drawer-2d-close:hover {
            background: #f5e8d5;
            transform: translateY(-2px);
        }

        /* Document Navigation Controls */
        #document-nav {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 101; /* Above timeline */
            pointer-events: all;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            backdrop-filter: blur(10px);
            background: rgba(233, 215, 190, 0.1);
            border: 2px solid #E9D7BE;
            border-radius: 30px;
            padding: 10px 25px;
        }

        #document-nav.visible {
            opacity: 1;
            visibility: visible;
        }

        #document-nav button {
            padding: 10px 20px;
            background: #E9D7BE;
            color: #2d2d2d;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        #document-nav button:hover {
            background: #f5e8d5;
            transform: translateY(-2px);
        }
        #document-nav button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .compass-rose {
                width: 60px;
                height: 60px;
                font-size: 20px;
                top: 20px;
                right: 20px;
            }

            .timeline-container {
                height: 50px;
                padding: 0 15px;
                bottom: 20px;
            }

            .timeline-thumb {
                width: 18px;
                height: 18px;
                top: -7px;
            }

            .info-panel {
                top: 20px;
                left: 20px;
                max-width: 250px;
                padding: 15px;
            }

            .info-title {
                font-size: 16px;
                margin-bottom: 8px;
            }

            .info-description {
                font-size: 12px;
            }

            .debug-panel {
                top: 90px;
                right: 20px;
                font-size: 10px;
                padding: 8px;
            }

            #document-nav {
                flex-direction: column;
                gap: 10px;
                padding: 10px 15px;
                bottom: 10px;
            }
            #document-nav button {
                width: 100%;
                padding: 8px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="loading">Loading Memory Vault...</div>
        <div id="ui-overlay">
            <div class="compass-rose" id="compass" title="Rotate View">
                ⟲
            </div>

            <div class="timeline-container" id="timeline-container">
                <div class="timeline-track" id="timeline">
                    <div class="timeline-thumb" id="timeline-thumb"></div>
                </div>
            </div>

            <div class="info-panel" id="info-panel">
                <div class="info-title" id="info-title">Memory Fragment</div>
                <div class="info-description" id="info-description">
                    Click on drawers to explore archived memories and artifacts.
                </div>
            </div>

            <div class="debug-panel" id="debug-panel">
                <div class="debug-item">FPS: <span id="fps">0</span></div>
                <div class="debug-item">Open Drawer: <span id="open-drawer">None</span></div>
                <div class="debug-item">Visible Artifacts: <span id="visible-artifacts">0</span></div>
                <div class="debug-item">Timeline: <span id="timeline-debug">0%</span></div>
                <div class="debug-item">Camera Rot: <span id="camera-rot">0°</span></div>
                <div class="debug-item">Mouse: <span id="mouse-pos">0, 0</span></div>
            </div>

            <!-- 2D Drawer Modal for Artifacts -->
            <div id="drawer-2d-modal" class="drawer-2d-modal">
                <h3 id="drawer-2d-title"></h3>
                <p class="drawer-2d-desc" id="drawer-2d-description"></p>
                <div id="drawer-2d-artifacts">
                    <!-- Artifacts will be dynamically inserted here -->
                </div>
                <button id="drawer-2d-close">Close Drawer</button>
            </div>

            <!-- Document Navigation Controls -->
            <div id="document-nav">
                <button id="prev-doc">Previous Document</button>
                <button id="next-doc">Next Document</button>
                <button id="close-file">Close File</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- REQUIRED FOR RECTAREALIGHT: -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/lights/RectAreaLightUniformsLib.js"></script>
    <script>
        class IsoMemoryVault {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.drawers = []; // Stores the THREE.Group for each drawer
                this.interactableDrawerMeshes = []; // Stores the main mesh of each drawer for raycasting
                this.artifacts = []; // All 3D floating artifacts
                this.fileFolders = []; // All 3D file folders

                this.currentRotation = 0;
                this.timelineValue = 0;
                this.raycaster = new THREE.Raycaster();
                this.pointer = new THREE.Vector2();
                this.openDrawer = null; // The currently open 3D drawer group
                this.activeFileFolder = null; // The currently 'opened' 3D file folder (camera zoomed into it)
                this.currentDocumentIndex = 0; // Index of the document currently displayed

                this.clock = new THREE.Clock();
                this.frameCount = 0;
                this.lastFPSUpdate = 0;
                this.debugMode = false;

                // State flags for different view modes
                this.is2DDrawerOpen = false; // Is the 2D artifact modal visible?
                this.isFileOpen = false;     // Is a 3D file folder open (camera zoomed in)?
                this.isGlobalAnimating = false; // Blocks all user interaction during complex animations

                // Custom Color Palette from Image
                this.colors = {
                    backgroundDark: 0x1A1A1A,
                    mainCream: 0xDDC3A3,
                    drawerHighlight: 0xF0E8D7,
                    outlineDark: 0x201A10,
                    gridLines: 0xC0AC8F,
                    documentPaper: 0xFFFFFF,
                    documentText: 0x333333,
                    documentGlow: 0xF2E4C7 // Slightly brighter version of mainCream
                };

                this.init();
                this.createScene();
                this.setupEventListeners();
                this.animate();
            }

            init() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(this.colors.backgroundDark);

                const aspect = window.innerWidth / window.innerHeight;
                const frustumSize = 10;
                this.camera = new THREE.OrthographicCamera(
                    frustumSize * aspect / -2, frustumSize * aspect / 2,
                    frustumSize / 2, frustumSize / -2,
                    0.1, 1000
                );
                this.camera.position.set(10, 10, 10);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                document.getElementById('container').appendChild(this.renderer.domElement);
                document.querySelector('.loading').style.display = 'none';

                // Initialize RectAreaLightUniformsLib for RectAreaLight to work
                // This is crucial and must be called once globally.
                if (typeof THREE.RectAreaLightUniformsLib !== 'undefined') {
                    THREE.RectAreaLightUniformsLib.init();
                } else {
                    console.warn("RectAreaLightUniformsLib not found. RectAreaLights might not render correctly.");
                }
            }

            createScene() {
                const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                this.scene.add(directionalLight);

                this.createGridFloor();
                this.createFilingCabinet();
                this.createSampleArtifactsAndFiles();
            }

            createGridFloor() {
                const gridSize = 20;

                // Create a canvas for the grid texture
                const canvas = document.createElement('canvas');
                canvas.width = 1024;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                // Fill background
                ctx.fillStyle = new THREE.Color(this.colors.mainCream).getStyle();
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw isometric grid lines
                ctx.strokeStyle = new THREE.Color(this.colors.gridLines).getStyle();
                ctx.lineWidth = 2;
                const lineSpacing = 64; // Adjust for density
                const isoSkew = 0.5; // Controls the 'isometric' angle

                // Horizontal lines
                for (let i = 0; i <= canvas.height / lineSpacing; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, i * lineSpacing + (canvas.width * isoSkew) / 2);
                    ctx.lineTo(canvas.width, i * lineSpacing - (canvas.width * isoSkew) / 2);
                    ctx.stroke();
                }

                // Vertical lines
                for (let i = 0; i <= canvas.width / lineSpacing; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * lineSpacing + (canvas.height * isoSkew) / 2, 0);
                    ctx.lineTo(i * lineSpacing - (canvas.height * isoSkew) / 2, canvas.height);
                    ctx.stroke();
                }

                const gridTexture = new THREE.CanvasTexture(canvas);
                gridTexture.wrapS = THREE.RepeatWrapping;
                gridTexture.wrapT = THREE.RepeatWrapping;
                gridTexture.repeat.set(2, 2); // Repeat the texture

                const floorGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
                const floorMaterial = new THREE.MeshLambertMaterial({
                    map: gridTexture,
                    color: new THREE.Color(this.colors.mainCream), // Base color from palette
                    transparent: true,
                    opacity: 0.9
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -0.15;
                floor.receiveShadow = true;
                this.scene.add(floor);

                // Removed the GridHelper as the textured plane now provides the grid
            }

            createFilingCabinet() {
                const cabinetGroup = new THREE.Group();

                // Base material for the cabinet body and drawers
                const cabinetDrawerMaterial = new THREE.MeshLambertMaterial({
                    color: new THREE.Color(this.colors.mainCream)
                });

                // Edge material for the distinct outlines
                const edgeMaterial = new THREE.LineBasicMaterial({
                    color: new THREE.Color(this.colors.outlineDark),
                    linewidth: 2 // This might not be effective on all platforms, 1 is common
                });

                // Cabinet main body (simplified as a large box for now)
                const cabinetBodyGeometry = new THREE.BoxGeometry(7.5, 5, 3.5); // Width, Height, Depth
                const cabinetBodyMesh = new THREE.Mesh(cabinetBodyGeometry, cabinetDrawerMaterial);
                cabinetBodyMesh.position.set(0, 2.4, 0); // Center it
                cabinetBodyMesh.castShadow = true;
                cabinetBodyMesh.receiveShadow = true;
                cabinetGroup.add(cabinetBodyMesh);

                // Add edges to the cabinet body
                const cabinetEdges = new THREE.EdgesGeometry(cabinetBodyGeometry);
                const cabinetEdgeLines = new THREE.LineSegments(cabinetEdges, edgeMaterial);
                cabinetEdgeLines.position.copy(cabinetBodyMesh.position);
                cabinetGroup.add(cabinetEdgeLines);


                const drawerData = [
                    { title: "Project Alpha", desc: "Early experimental work with generative algorithms" },
                    { title: "Digital Sketches", desc: "Collection of procedural art studies" },
                    { title: "Code Fragments", desc: "Archived development experiments" },
                    { title: "Visual Studies", desc: "Exploration of form and structure" },
                    { title: "Interactive Demos", desc: "Prototype user interfaces and experiences" },
                    { title: "Data Visualizations", desc: "Information design and representation" },
                    { title: "Concept Art", desc: "Ideation and creative development" },
                    { title: "Technical Notes", desc: "Documentation and process insights" },
                    { title: "Archive Misc", desc: "Miscellaneous creative artifacts" },
                    { title: "Future Projects", desc: "Planned explorations and concepts" },
                    { title: "Collaborations", desc: "Joint creative endeavors" },
                    { title: "Research", desc: "Theoretical and practical investigations" }
                ];

                // Create 4 rows of 3 drawers each, but place them within the cabinet body
                // Adjust position relative to the cabinet, not the origin
                const cabinetOffset = cabinetBodyMesh.position.clone();

                for (let row = 0; row < 4; row++) {
                    for (let col = 0; col < 3; col++) {
                        const index = row * 3 + col;
                        const drawerGroup = this.createDrawer(cabinetDrawerMaterial, edgeMaterial);

                        // Position drawers relative to the cabinet's face
                        drawerGroup.position.set(
                            cabinetOffset.x + (col - 1) * 2.5, // Spread horizontally
                            cabinetOffset.y + (1.5 - row * 1.2), // Stack vertically, 1.5 is starting Y for top row
                            cabinetOffset.z + 1.6 // Slightly in front of cabinet body
                        );
                        drawerGroup.userData = {
                            originalPosition: drawerGroup.position.clone(),
                            isOpen: false,
                            index: index,
                            data: drawerData[index] || { title: `Drawer ${index + 1}`, desc: "Empty drawer" },
                            artifacts: [],
                            files: []
                        };

                        cabinetGroup.add(drawerGroup);
                        this.drawers.push(drawerGroup);
                        // Store the main drawer face mesh for raycasting
                        this.interactableDrawerMeshes.push(drawerGroup.getObjectByName('drawerFace'));
                    }
                }
                this.scene.add(cabinetGroup);
            }

            createDrawer(material, edgeMaterial) {
                const drawerGroup = new THREE.Group();

                // Drawer Face (front panel)
                const drawerFaceGeometry = new THREE.BoxGeometry(2, 1, 0.1); // Thin front panel
                const drawerFace = new THREE.Mesh(drawerFaceGeometry, material);
                drawerFace.castShadow = true;
                drawerFace.receiveShadow = true;
                drawerFace.name = "drawerFace"; // Name for raycasting target
                drawerFace.userData.drawerGroup = drawerGroup; // Link back to the group
                drawerGroup.add(drawerFace);

                // Edges for the drawer face
                const drawerFaceEdges = new THREE.EdgesGeometry(drawerFaceGeometry);
                const drawerFaceEdgeLines = new THREE.LineSegments(drawerFaceEdges, edgeMaterial);
                drawerGroup.add(drawerFaceEdgeLines);

                // Drawer Handle (recessed rectangle matching image)
                const handleGeometry = new THREE.BoxGeometry(0.8, 0.2, 0.05); // Width, height, depth
                const handleMaterial = new THREE.MeshLambertMaterial({ color: new THREE.Color(this.colors.drawerHighlight) });
                const handle = new THREE.Mesh(handleGeometry, handleMaterial);
                handle.position.set(0, 0, 0.06); // Slightly in front of the drawer face
                handle.name = "drawerHandle";
                drawerGroup.add(handle);

                // Recessed Handle Edges
                const handleEdges = new THREE.EdgesGeometry(handleGeometry);
                const handleEdgeLines = new THREE.LineSegments(handleEdges, edgeMaterial);
                handleEdgeLines.position.copy(handle.position);
                drawerGroup.add(handleEdgeLines);

                // Invisible interior meshes for raycasting - they define the clickable area of the 'drawer'
                // The actual 3D interior will only be visible when the drawer is pulled out
                const drawerInteriorGeometry = new THREE.BoxGeometry(1.8, 0.8, 2.8); // Defines the internal space
                const drawerInteriorMaterial = new THREE.MeshLambertMaterial({
                    color: new THREE.Color(this.colors.backgroundDark),
                    transparent: true,
                    opacity: 0.9 // Becomes visible when drawer is out
                });
                const drawerInterior = new THREE.Mesh(drawerInteriorGeometry, drawerInteriorMaterial);
                drawerInterior.position.z = -1.4; // Positioned behind the face
                drawerInterior.name = "drawerInterior";
                drawerInterior.visible = false; // Initially hidden
                drawerInterior.castShadow = true;
                drawerInterior.receiveShadow = true;
                drawerGroup.add(drawerInterior);

                return drawerGroup;
            }

            createSampleArtifactsAndFiles() {
                const artifactNameOptions = ["Quantum Loop", "Echo Chamber", "Data Stream", "Memory Crystal", "Glitch Sphere", "Void Fragment", "Temporal Knot", "Aether Shard", "Chronosphere", "Lumin Flux"];
                const artifactIconOptions = ["🌀", "🔊", "📊", "💎", "👾", "⚫", "⏳", "✨", "🕰️", "💡"];
                const artifactDescOptions = [
                    "A fragment of pure thought, resonating with past echoes.",
                    "Contains archived data, compressed beyond recognition.",
                    "A relic from a forgotten timeline, unstable yet compelling.",
                    "Exhibits unusual energy patterns, indicative of complex processes.",
                    "A raw manifestation of a concept, unrefined but potent.",
                    "Holds a key to an understanding previously lost to time.",
                    "Its structure suggests complex self-organizing principles.",
                    "A phantom trace of a completed cycle, shimmering with potential.",
                    "Reflects abstract logic, cold but perfectly formed.",
                    "Whispers of an untold story, waiting to be deciphered."
                ];

                const fileNameOptions = ["Research Notes", "Design Blueprints", "Legacy Codebase", "Project Memos", "Concept Sketches", "Financial Records", "User Feedback", "System Logs", "Historical Data"];
                const fileDescOptions = [
                    "Detailed notes from various research initiatives.",
                    "Architectural plans and design specifications.",
                    "Archived source code, mostly in esoteric languages.",
                    "Internal communications and meeting summaries.",
                    "Early visual ideas and ideation documents.",
                    "Financial projections and expenditure reports.",
                    "Direct feedback from user testing sessions.",
                    "Automated system event logs.",
                    "Collections of past events and critical milestones."
                ];

                this.drawers.forEach((drawer, drawerIndex) => {
                    const artifactCount = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < artifactCount; i++) {
                        const type = ['cube', 'sphere', 'pyramid', 'cylinder'][Math.floor(Math.random() * 4)];
                        const artifact = this.createArtifact(type);
                        artifact.scale.setScalar(0.15 + Math.random() * 0.2);
                        artifact.visible = false;
                        artifact.userData = {
                            type: type,
                            floatOffset: Math.random() * Math.PI * 2,
                            emergenceDelay: i * 150,
                            drawerIndex: drawerIndex,
                            originalScale: artifact.scale.x,
                            isEmerging: false,
                            emergenceProgress: 0,
                            targetPosition: new THREE.Vector3(),
                            startPosition: new THREE.Vector3(),
                            artifactData2D: {
                                name: artifactNameOptions[Math.floor(Math.random() * artifactNameOptions.length)],
                                icon: artifactIconOptions[Math.floor(Math.random() * artifactIconOptions.length)],
                                description: artifactDescOptions[Math.floor(Math.random() * artifactDescOptions.length)]
                            },
                            onAnimationComplete: null // Callback for promise resolution
                        };
                        drawer.userData.artifacts.push(artifact);
                        this.artifacts.push(artifact);
                        this.scene.add(artifact);
                    }

                    const fileCount = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < fileCount; i++) {
                        const fileFolder = this.createFileFolder();
                        fileFolder.scale.setScalar(0.01);
                        fileFolder.visible = false;
                        fileFolder.userData = {
                            originalPosition: new THREE.Vector3(),
                            targetPosition: new THREE.Vector3(),
                            isEmerging: false,
                            emergenceProgress: 0,
                            emergenceDelay: (artifactCount + i) * 150,
                            originalScale: 0.8,
                            data: {
                                title: fileNameOptions[Math.floor(Math.random() * fileNameOptions.length)],
                                desc: fileDescOptions[Math.floor(Math.random() * fileDescOptions.length)]
                            },
                            documents: [],
                            onAnimationComplete: null
                        };
                        // Link the fileFolderBody mesh back to its group for raycasting
                        fileFolder.getObjectByName('fileFolderBody').userData.fileFolderGroup = fileFolder;

                        const docCount = 2 + Math.floor(Math.random() * 3);
                        for (let j = 0; j < docCount; j++) {
                            const docData = {
                                title: `Doc ${j + 1}: ${fileFolder.userData.data.title}`,
                                content: `This is the content for Document ${j + 1} in the file "${fileFolder.userData.data.title}". It contains details about a specific topic related to this file. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.`,
                                image: null
                            };
                            if (j % 2 === 0 && Math.random() > 0.5) {
                                docData.image = 'https://picsum.photos/400/300?random=' + (drawerIndex + i + j);
                            }

                            const documentMaterial = this.createDocumentMaterial(docData);
                            const documentGeometry = new THREE.PlaneGeometry(1.5, 2);
                            // Apply a subtle wave deformation to the plane
                            const vertices = documentGeometry.attributes.position.array;
                            for (let k = 0; k < vertices.length; k += 3) {
                                vertices[k + 1] += Math.sin(vertices[k] * Math.PI * 0.5) * 0.05; // Y-offset based on X
                                vertices[k + 2] += Math.cos(vertices[k] * Math.PI * 0.5) * 0.02; // Z-offset based on X
                            }
                            documentGeometry.attributes.position.needsUpdate = true;
                            documentGeometry.computeVertexNormals();


                            const documentMesh = new THREE.Mesh(documentGeometry, documentMaterial);
                            documentMesh.name = "document";
                            documentMesh.userData.mainMesh = documentMesh; // For opacity control
                            documentMesh.userData.data = docData;
                            documentMesh.castShadow = true;

                            documentMesh.visible = false;
                            documentMesh.userData = {
                                ...documentMesh.userData,
                                isEmerging: false,
                                emergenceProgress: 0,
                                originalScale: 1, // Documents will be at scale 1 after emergence.
                                startPosition: new THREE.Vector3(0, 0, 0), // Relative to file folder (initially inside it)
                                targetPosition: new THREE.Vector3(0, 0, 0.1) // Slightly in front of folder (visible position)
                            };
                            fileFolder.userData.documents.push(documentMesh);
                            fileFolder.add(documentMesh); // Documents are children of the fileFolder group
                        }

                        drawer.userData.files.push(fileFolder);
                        this.fileFolders.push(fileFolder);
                        this.scene.add(fileFolder);
                    }
                });
                console.log(`Created ${this.artifacts.length} artifacts and ${this.fileFolders.length} file folders across ${this.drawers.length} drawers`);
            }

            createArtifact(type) {
                let geometry;
                switch (type) {
                    case 'cube': geometry = new THREE.BoxGeometry(1, 1, 1); break;
                    case 'sphere': geometry = new THREE.SphereGeometry(0.5, 8, 6); break;
                    case 'pyramid': geometry = new THREE.ConeGeometry(0.5, 1, 4); break;
                    case 'cylinder': geometry = new THREE.CylinderGeometry(0.3, 0.3, 1, 8); break;
                    default: geometry = new THREE.BoxGeometry(1, 1, 1);
                }

                const hue = Math.random();
                const material = new THREE.MeshLambertMaterial({
                    color: new THREE.Color().setHSL(hue, 0.6, 0.7),
                    transparent: true,
                    opacity: 0.85,
                    emissive: new THREE.Color().setHSL(hue, 0.3, 0.1)
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;

                const wireframe = new THREE.WireframeGeometry(geometry);
                const wireframeMaterial = new THREE.LineBasicMaterial({
                    color: new THREE.Color(this.colors.outlineDark), // Use outline color
                    transparent: true,
                    opacity: 0.2 // More subtle wireframe
                });
                const wireframeMesh = new THREE.LineSegments(wireframe, wireframeMaterial);

                const group = new THREE.Group();
                group.add(mesh);
                group.add(wireframeMesh);
                group.userData.mainMesh = mesh; // Store reference to the main mesh for opacity control
                return group;
            }

            createFileFolder() {
                const folderGroup = new THREE.Group();

                // Folder 'body' (a thin box)
                const folderGeometry = new THREE.BoxGeometry(1.5, 1.2, 0.1); // Thin folder body
                const folderMaterial = new THREE.MeshLambertMaterial({
                    color: new THREE.Color(this.colors.mainCream), // Cream color
                    transparent: true,
                    opacity: 0.9
                });
                const folderMesh = new THREE.Mesh(folderGeometry, folderMaterial);
                folderMesh.name = "fileFolderBody"; // Name for raycasting
                folderMesh.castShadow = true;
                folderMesh.receiveShadow = true;
                // userData.fileFolderGroup will be set in createSampleArtifactsAndFiles

                // Edges for the folder body
                const folderEdges = new THREE.EdgesGeometry(folderGeometry);
                const folderEdgeLines = new THREE.LineSegments(folderEdges, new THREE.LineBasicMaterial({
                    color: new THREE.Color(this.colors.outlineDark),
                    linewidth: 1
                }));
                folderGroup.add(folderEdgeLines);

                // Tab on top
                const tabGeometry = new THREE.BoxGeometry(0.5, 0.15, 0.05);
                const tabMaterial = new THREE.MeshLambertMaterial({ color: new THREE.Color(this.colors.drawerHighlight) }); // Lighter cream tab
                const tabMesh = new THREE.Mesh(tabGeometry, tabMaterial);
                tabMesh.position.set(0.4, 0.675, 0); // Position on top right
                tabMesh.name = "fileFolderTab";

                // Edges for the tab
                const tabEdges = new THREE.EdgesGeometry(tabGeometry);
                const tabEdgeLines = new THREE.LineSegments(tabEdges, new THREE.LineBasicMaterial({
                    color: new THREE.Color(this.colors.outlineDark),
                    linewidth: 1
                }));
                tabEdgeLines.position.copy(tabMesh.position);
                folderGroup.add(tabEdgeLines);

                folderGroup.add(folderMesh);
                folderGroup.add(tabMesh);
                folderGroup.userData.mainMesh = folderMesh; // For opacity control
                return folderGroup;
            }

            createDocumentMaterial(data) {
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = 800;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = new THREE.Color(this.colors.documentPaper).getStyle();
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = 'bold 60px "Times New Roman", serif'; // Larger font for title
                ctx.fillStyle = new THREE.Color(this.colors.documentText).getStyle();
                ctx.textAlign = 'center'; // Center align title
                ctx.fillText(data.title, canvas.width / 2, 100);

                ctx.font = '30px "Times New Roman", serif'; // Smaller font for body
                ctx.textAlign = 'left';
                const wrapText = (context, text, x, y, maxWidth, lineHeight) => {
                    const words = text.split(' ');
                    let line = '';
                    for (let n = 0; n < words.length; n++) {
                        const testLine = line + words[n] + ' ';
                        const metrics = context.measureText(testLine);
                        const testWidth = metrics.width;
                        if (testWidth > maxWidth && n > 0) {
                            context.fillText(line, x, y);
                            line = words[n] + ' ';
                            y += lineHeight;
                        } else {
                            line = testLine;
                        }
                    }
                    context.fillText(line, x, y);
                };

                wrapText(ctx, data.content, 50, 180, canvas.width - 100, 35);

                const documentTexture = new THREE.CanvasTexture(canvas);
                const documentMaterial = new THREE.MeshLambertMaterial({
                    map: documentTexture,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0 // Start hidden
                });

                if (data.image) {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 50, 450, 500, 300);
                        documentTexture.needsUpdate = true;
                    };
                    img.src = data.image;
                }
                return documentMaterial;
            }


            setupEventListeners() {
                window.addEventListener('resize', () => {
                    const aspect = window.innerWidth / window.innerHeight;
                    const frustumSize = this.camera.top * 2;
                    this.camera.left = frustumSize * aspect / -2;
                    this.camera.right = frustumSize * aspect / 2;
                    this.camera.top = frustumSize / 2;
                    this.camera.bottom = frustumSize / -2;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                const container = document.getElementById('container');

                // Pointer (Mouse & Touch) interaction for 3D elements
                container.addEventListener('click', (event) => {
                    if (this.isGlobalAnimating) return; // Prevent clicks during global animations
                    this.onPointerClick(this.getPointerCoordinates(event));
                });
                container.addEventListener('mousemove', (event) => {
                    if (this.isGlobalAnimating) return;
                    this.onPointerMove(this.getPointerCoordinates(event));
                });
                container.addEventListener('touchstart', (event) => {
                    if (this.isGlobalAnimating || event.touches.length > 1) return;
                    this.onPointerClick(this.getPointerCoordinates(event.touches[0]));
                }, { passive: true });
                container.addEventListener('touchmove', (event) => {
                    if (this.isGlobalAnimating || event.touches.length > 1) return;
                    this.onPointerMove(this.getPointerCoordinates(event.touches[0]));
                }, { passive: true });


                document.getElementById('compass').addEventListener('click', () => {
                    if (!this.isFileOpen && !this.is2DDrawerOpen && !this.isGlobalAnimating) {
                        this.rotateView();
                    }
                });

                this.setupTimelineInteraction();

                document.addEventListener('keydown', (event) => {
                    if (event.key === 'd' || event.key === 'D') {
                        this.debugMode = !this.debugMode;
                        const debugPanel = document.getElementById('debug-panel');
                        debugPanel.classList.toggle('visible', this.debugMode);
                        console.log('Debug mode', this.debugMode ? 'enabled' : 'disabled');
                    }
                });

                document.getElementById('drawer-2d-close').addEventListener('click', () => {
                    this.hide2DDrawer();
                });

                document.getElementById('prev-doc').addEventListener('click', () => this.showPreviousDocument());
                document.getElementById('next-doc').addEventListener('click', () => this.showNextDocument());
                document.getElementById('close-file').addEventListener('click', () => this.closeFileFolder());
            }

            getPointerCoordinates(event) {
                const clientX = event.clientX !== undefined ? event.clientX : event.touches[0].clientX;
                const clientY = event.clientY !== undefined ? event.clientY : event.touches[0].clientY;
                const x = (clientX / window.innerWidth) * 2 - 1;
                const y = -(clientY / window.innerHeight) * 2 + 1;
                return { x, y };
            }

            setupTimelineInteraction() {
                const timeline = document.getElementById('timeline');
                const thumb = document.getElementById('timeline-thumb');
                let isDragging = false;

                const updateTimeline = (clientX) => {
                    const rect = timeline.getBoundingClientRect();
                    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
                    const percentage = x / rect.width;

                    thumb.style.left = `${percentage * 100}%`;
                    this.timelineValue = percentage;
                    this.updateTimelineEffects();
                };

                const startDrag = (event) => {
                    if (this.isGlobalAnimating || this.isFileOpen || this.is2DDrawerOpen) return;
                    isDragging = true;
                    event.preventDefault();
                    const clientX = event.clientX || event.touches[0].clientX;
                    updateTimeline(clientX);
                };

                const duringDrag = (event) => {
                    if (isDragging) {
                        const clientX = event.clientX || event.touches[0].clientX;
                        updateTimeline(clientX);
                    }
                };

                const endDrag = () => {
                    isDragging = false;
                };

                timeline.addEventListener('mousedown', startDrag);
                document.addEventListener('mousemove', duringDrag);
                document.addEventListener('mouseup', endDrag);

                timeline.addEventListener('touchstart', startDrag, { passive: false });
                document.addEventListener('touchmove', duringDrag, { passive: false });
                document.addEventListener('touchend', endDrag);
            }

            updateTimelineEffects() {
                const layerCount = 4;
                const currentLayer = Math.floor(this.timelineValue * layerCount);

                this.drawers.forEach((drawer, index) => {
                    const drawerRow = Math.floor(index / 3);
                    const shouldBeVisible = drawerRow <= currentLayer || this.timelineValue > 0.95;

                    if (!drawer.userData.isOpen && !this.isFileOpen && !this.is2DDrawerOpen && !this.isGlobalAnimating) {
                        if (drawer.visible !== shouldBeVisible) {
                            drawer.visible = shouldBeVisible;
                        }
                        drawer.children.forEach(child => {
                            if (child.material) {
                                child.material.transparent = true;
                                child.material.opacity = Math.min(1, 0.3 + this.timelineValue * 0.7);
                            }
                        });
                    } else if (drawer.userData.isOpen && !this.isFileOpen && !this.is2DDrawerOpen && !this.isGlobalAnimating) {
                        drawer.visible = true;
                        drawer.children.forEach(child => {
                            if (child.material) {
                                child.material.transparent = true;
                                child.material.opacity = 1.0;
                            }
                        });
                    }
                });
                const timelineContainer = document.getElementById('timeline-container');
                if (this.isFileOpen || this.is2DDrawerOpen || this.isGlobalAnimating) {
                    timelineContainer.style.opacity = '0';
                    timelineContainer.style.pointerEvents = 'none';
                } else {
                    timelineContainer.style.opacity = '1';
                    timelineContainer.style.pointerEvents = 'all';
                }
            }


            onPointerClick(coords) {
                if (this.isGlobalAnimating) return;

                this.pointer.x = coords.x;
                this.pointer.y = coords.y;

                this.raycaster.setFromCamera(this.pointer, this.camera);

                let clickedEntity = null;
                let clickedType = null;

                if (this.openDrawer) {
                    // When a drawer is open, check its contents (files and artifacts)
                    const interactablesInOpenDrawer = [];
                    // Add main meshes for file folders
                    this.openDrawer.userData.files.forEach(f => interactablesInOpenDrawer.push(f.getObjectByName('fileFolderBody')));
                    // Add main meshes for artifacts
                    this.openDrawer.userData.artifacts.forEach(a => interactablesInOpenDrawer.push(a.userData.mainMesh));

                    const intersects = this.raycaster.intersectObjects(interactablesInOpenDrawer, false);
                    if (intersects.length > 0) {
                        const intersectedObject = intersects[0].object;
                        if (intersectedObject.name === 'fileFolderBody') {
                            clickedEntity = intersectedObject.userData.fileFolderGroup; // Get the parent file folder group
                            clickedType = 'fileFolder';
                        } else if (intersectedObject.userData.mainMesh) { // This is an artifact's mainMesh
                            clickedEntity = intersectedObject.parent; // Get the artifact's group
                            clickedType = 'artifact';
                        }
                    }
                } else {
                    // No drawer open, check for drawer clicks (using the main drawer body meshes)
                    const drawerIntersects = this.raycaster.intersectObjects(this.interactableDrawerMeshes, false);
                    if (drawerIntersects.length > 0) {
                        clickedEntity = drawerIntersects[0].object.userData.drawerGroup; // Get the parent drawer group
                        clickedType = 'drawer';
                    }
                }

                if (clickedType === 'drawer') {
                    this.toggleDrawer(clickedEntity);
                } else if (clickedType === 'fileFolder') {
                    this.openFileFolder(clickedEntity);
                } else if (clickedType === 'artifact') {
                    this.show2DDrawer(this.openDrawer); // Open 2D artifact modal for the current drawer
                    console.log("Clicked artifact: ", clickedEntity.userData.artifactData2D.name);
                }
            }

            onPointerMove(coords) {
                this.pointer.x = coords.x;
                this.pointer.y = coords.y;
                document.getElementById('mouse-pos').textContent = `${this.pointer.x.toFixed(2)}, ${this.pointer.y.toFixed(2)}`;

                if (this.isGlobalAnimating || this.is2DDrawerOpen || this.isFileOpen) {
                    document.body.style.cursor = 'default';
                    return;
                }

                this.raycaster.setFromCamera(this.pointer, this.camera);
                let hoveredEntity = null;
                let hoverType = 'default';

                if (this.openDrawer) {
                    const interactablesInOpenDrawer = [];
                    this.openDrawer.userData.files.forEach(f => interactablesInOpenDrawer.push(f.getObjectByName('fileFolderBody')));
                    this.openDrawer.userData.artifacts.forEach(a => interactablesInOpenDrawer.push(a.userData.mainMesh));

                    const intersects = this.raycaster.intersectObjects(interactablesInOpenDrawer, false);
                    if (intersects.length > 0) {
                        const intersectedObject = intersects[0].object;
                        if (intersectedObject.name === 'fileFolderBody') {
                            hoveredEntity = intersectedObject.userData.fileFolderGroup;
                            hoverType = 'fileFolder';
                            this.showInfo(hoveredEntity.userData.data);
                        } else if (intersectedObject.userData.mainMesh) {
                            hoveredEntity = intersectedObject.parent;
                            hoverType = 'artifact';
                            this.showInfo(hoveredEntity.userData.artifactData2D);
                        }
                    } else {
                        this.hideInfo();
                    }
                } else {
                    const drawerIntersects = this.raycaster.intersectObjects(this.interactableDrawerMeshes, false);
                    if (drawerIntersects.length > 0) {
                        hoveredEntity = drawerIntersects[0].object.userData.drawerGroup;
                        hoverType = 'drawer';
                        this.showInfo(hoveredEntity.userData.data);
                    } else {
                        this.hideInfo();
                    }
                }

                document.body.style.cursor = (hoverType !== 'default') ? 'pointer' : 'default';
            }


            toggleDrawer(drawer) {
                if (this.isGlobalAnimating) return Promise.resolve();

                this.isGlobalAnimating = true; // Start global animation block
                document.getElementById('container').classList.add('animating-global');

                let sequence;
                if (this.openDrawer && this.openDrawer !== drawer) {
                    // Close existing drawer and any active file/modal, then open new drawer
                    sequence = this.closeFileFolder()
                        .then(() => this.hide2DDrawer())
                        .then(() => this.closeDrawer(this.openDrawer))
                        .then(() => this.openDrawerAnimation(drawer));
                } else if (drawer.userData.isOpen) {
                    // If the current drawer is already open, close it (and any active file/modal)
                    sequence = this.closeFileFolder()
                        .then(() => this.hide2DDrawer())
                        .then(() => this.closeDrawer(drawer));
                } else {
                    // Open a new drawer
                    sequence = this.openDrawerAnimation(drawer);
                }

                return sequence.finally(() => {
                    this.isGlobalAnimating = false; // End global animation block
                    document.getElementById('container').classList.remove('animating-global');
                }).catch(e => console.error("Error in toggleDrawer sequence:", e));
            }

            openDrawerAnimation(drawer) {
                console.log(`Starting openDrawerAnimation for drawer ${drawer.userData.index}`);
                drawer.userData.isOpen = true;
                this.openDrawer = drawer;
                this.hideInfo();
                document.getElementById('container').classList.remove('modal-open', 'file-open'); // Ensure 3D interaction is active

                const targetPosition = drawer.userData.originalPosition.clone();
                targetPosition.z += 2.5;

                // Make interior visible
                const interiorMesh = drawer.getObjectByName('drawerInterior');
                if(interiorMesh) interiorMesh.visible = true;

                // Stage 1: Slide drawer out
                return this.animatePosition(drawer, targetPosition, 800)
                    .then(() => {
                        console.log("Drawer slid out. Starting artifact/file emergence.");
                        const allEmergencePromises = [];

                        // Artifacts emergence
                        drawer.userData.artifacts.forEach(artifact => {
                            const emergencePromise = new Promise(resolve => {
                                setTimeout(() => {
                                    artifact.visible = true;
                                    artifact.userData.isEmerging = true;
                                    artifact.userData.emergenceProgress = 0;

                                    const drawerPos = drawer.position.clone();
                                    artifact.userData.startPosition.copy(drawerPos);
                                    artifact.userData.startPosition.z = drawerPos.z - 1.4; // Emerges from inside drawer body

                                    const angle = (Math.random() * Math.PI * 2);
                                    const radius = 1 + Math.random() * 0.5;
                                    artifact.userData.targetPosition.set(
                                        drawerPos.x + Math.cos(angle) * radius,
                                        drawerPos.y + 1.5 + Math.random() * 0.5,
                                        drawerPos.z + Math.sin(angle) * radius + 1
                                    );
                                    artifact.position.copy(artifact.userData.startPosition);
                                    artifact.scale.setScalar(0.01);
                                    if (artifact.userData.mainMesh && artifact.userData.mainMesh.material) {
                                        artifact.userData.mainMesh.material.opacity = 0.05;
                                    }
                                    artifact.userData.onAnimationComplete = resolve; // Call resolve when animate() detects completion
                                }, artifact.userData.emergenceDelay);
                            });
                            allEmergencePromises.push(emergencePromise);
                        });

                        // File folders emergence
                        drawer.userData.files.forEach(fileFolder => {
                            const emergencePromise = new Promise(resolve => {
                                setTimeout(() => {
                                    fileFolder.visible = true;
                                    fileFolder.userData.isEmerging = true;
                                    fileFolder.userData.emergenceProgress = 0;

                                    const drawerPos = drawer.position.clone();
                                    fileFolder.userData.originalPosition.copy(drawerPos);
                                    fileFolder.userData.originalPosition.z = drawerPos.z - 1.4; // Files emerge from inside drawer body

                                    const fileIndex = drawer.userData.files.indexOf(fileFolder);
                                    const totalFiles = drawer.userData.files.length;
                                    const offset = (fileIndex - (totalFiles - 1) / 2) * 0.8;
                                    fileFolder.userData.targetPosition.set(
                                        drawerPos.x + offset,
                                        drawerPos.y + 0.5,
                                        drawerPos.z + 3.5
                                    );
                                    fileFolder.position.copy(fileFolder.userData.originalPosition);
                                    fileFolder.scale.setScalar(0.01);
                                    if (fileFolder.userData.mainMesh && fileFolder.userData.mainMesh.material) {
                                        fileFolder.userData.mainMesh.material.opacity = 0.05;
                                    }
                                    fileFolder.userData.onAnimationComplete = resolve;
                                }, fileFolder.userData.emergenceDelay);
                            });
                            allEmergencePromises.push(emergencePromise);
                        });

                        return Promise.all(allEmergencePromises).then(() => {
                            console.log("All artifacts and files fully emerged in 3D.");
                        });
                    });
            }

            closeDrawer(drawer) {
                console.log(`Starting closeDrawer for drawer ${drawer.userData.index}`);
                drawer.userData.isOpen = false;
                this.openDrawer = null;
                this.hideInfo();

                const allReturnPromises = [];

                // Artifacts return and disappear
                drawer.userData.artifacts.forEach(artifact => {
                    const returnPromise = new Promise(resolve => {
                        const drawerInteriorTarget = drawer.userData.originalPosition.clone();
                        drawerInteriorTarget.z = drawerInteriorTarget.z - 1.4; // Return to inside drawer body
                        drawerInteriorTarget.y += (Math.random() - 0.5) * 0.3; // Slight variation
                        this.animateObjectTransition(artifact, 400, 'out', drawerInteriorTarget).then(() => {
                            artifact.visible = false;
                            artifact.userData.emergenceProgress = 0; // Reset for next time
                            resolve();
                        });
                    });
                    allReturnPromises.push(returnPromise);
                });

                // File folders return and disappear
                drawer.userData.files.forEach(fileFolder => {
                    const returnPromise = new Promise(resolve => {
                        const drawerInteriorTarget = fileFolder.userData.originalPosition.clone();
                        drawerInteriorTarget.z = fileFolder.userData.originalPosition.z - 1.4; // Return to inside drawer body
                        this.animateObjectTransition(fileFolder, 400, 'out', drawerInteriorTarget).then(() => {
                            fileFolder.visible = false;
                            fileFolder.userData.emergenceProgress = 0; // Reset for next time
                            resolve();
                        });
                    });
                    allReturnPromises.push(returnPromise);
                });

                return Promise.all(allReturnPromises).then(() => {
                    console.log("All artifacts and files returned.");
                    // Make interior invisible again
                    const interiorMesh = drawer.getObjectByName('drawerInterior');
                    if(interiorMesh) interiorMesh.visible = false;
                    // Stage 3: Drawer slides back in
                    return this.animatePosition(drawer, drawer.userData.originalPosition, 600);
                });
            }

            // NEW: Open a specific file folder (zoom in)
            openFileFolder(fileFolder) {
                if (this.isFileOpen || this.isGlobalAnimating) return Promise.resolve();
                console.log(`Starting openFileFolder for: ${fileFolder.userData.data.title}`);
                this.isFileOpen = true;
                this.activeFileFolder = fileFolder;
                this.hideInfo();
                document.getElementById('container').classList.add('file-open'); // Disable 3D interaction

                // Hide other file folders and artifacts in the current drawer
                const otherObjectPromises = [];
                this.openDrawer.userData.files.forEach(f => {
                    if (f !== fileFolder) {
                        otherObjectPromises.push(this.animateObjectTransition(f, 300, 'out'));
                    }
                });
                this.openDrawer.userData.artifacts.forEach(a => {
                    otherObjectPromises.push(this.animateObjectTransition(a, 300, 'out'));
                });

                // Animate camera to zoom into the file folder, after other objects start fading
                return Promise.all(otherObjectPromises).then(() => {
                    const targetCameraPosition = fileFolder.position.clone();
                    targetCameraPosition.x += 0;
                    targetCameraPosition.y += 0.8;
                    targetCameraPosition.z += 2;

                    const targetFrustumSize = 3;
                    return this.animateCamera(targetCameraPosition, 1000, targetFrustumSize);
                }).then(() => {
                    console.log("Camera zoomed into file folder. Displaying documents.");
                    // Display the first document after camera zoom is complete
                    this.currentDocumentIndex = 0;
                    this.displayCurrentDocument();
                }).catch(e => console.error("Error openFileFolder sequence:", e));
            }

            // NEW: Close the active file folder (zoom out)
            closeFileFolder() {
                if (!this.isFileOpen && !this.isGlobalAnimating) return Promise.resolve();

                console.log(`Starting closeFileFolder for: ${this.activeFileFolder ? this.activeFileFolder.userData.data.title : 'N/A'}`);
                this.isFileOpen = false;
                document.getElementById('container').classList.remove('file-open'); // Re-enable general 3D interaction

                // Hide documents
                const documentHidePromises = this.activeFileFolder.userData.documents.map(doc => {
                    // Documents return to 'inside' file folder position (relative to file folder)
                    const returnPos = doc.userData.startPosition;
                    return this.animateObjectTransition(doc, 300, 'out', returnPos);
                });
                document.getElementById('document-nav').classList.remove('visible'); // Hide document nav

                return Promise.all(documentHidePromises).then(() => {
                    console.log("Documents hidden. Zooming camera out.");
                    const originalCameraPosition = new THREE.Vector3(10, 10, 10);
                    const originalFrustumSize = 10;

                    return this.animateCamera(originalCameraPosition, 1000, originalFrustumSize);
                }).then(() => {
                    console.log("Camera zoomed out. Restoring other file folders/artifacts.");
                    const restorePromises = [];
                    this.openDrawer.userData.files.forEach(f => {
                        if (f !== this.activeFileFolder) {
                            f.visible = true;
                            restorePromises.push(this.animateObjectTransition(f, 300, 'in'));
                        }
                    });
                    this.openDrawer.userData.artifacts.forEach(a => {
                        a.visible = true;
                        restorePromises.push(this.animateObjectTransition(a, 300, 'in'));
                    });
                    this.activeFileFolder = null;

                    return Promise.all(restorePromises);
                }).catch(e => console.error("Error closeFileFolder sequence:", e));
            }

            // NEW: Display the current document
            displayCurrentDocument() {
                if (!this.activeFileFolder || !this.activeFileFolder.userData.documents.length) return;

                const documents = this.activeFileFolder.userData.documents;
                const docCount = documents.length;
                this.currentDocumentIndex = Math.max(0, Math.min(this.currentDocumentIndex, docCount - 1));

                documents.forEach((doc, index) => {
                    if (index === this.currentDocumentIndex) {
                        doc.visible = true;
                        doc.userData.isEmerging = true; // Use emergence for document display
                        doc.userData.emergenceProgress = 0;

                        doc.position.copy(doc.userData.startPosition); // Start at (0,0,0) relative to file folder
                        doc.scale.setScalar(0.01); // Start small
                        if (doc.userData.mainMesh && doc.userData.mainMesh.material) {
                            doc.userData.mainMesh.material.opacity = 0.05; // Start transparent
                        }
                    } else {
                        doc.visible = false; // Hide other documents
                    }
                });

                document.getElementById('document-nav').classList.add('visible');
                document.getElementById('prev-doc').disabled = (this.currentDocumentIndex === 0);
                document.getElementById('next-doc').disabled = (this.currentDocumentIndex === docCount - 1);
            }

            // NEW: Navigate documents
            showNextDocument() {
                if (this.isGlobalAnimating || !this.activeFileFolder || this.currentDocumentIndex >= this.activeFileFolder.userData.documents.length - 1) {
                    return;
                }
                const currentDoc = this.activeFileFolder.userData.documents[this.currentDocumentIndex];
                this.animateDocumentFlip(currentDoc, 'out-right')
                    .then(() => {
                        this.currentDocumentIndex++;
                        this.displayCurrentDocument();
                    })
                    .catch(e => console.error("Error showing next document:", e));
            }

            showPreviousDocument() {
                if (this.isGlobalAnimating || !this.activeFileFolder || this.currentDocumentIndex <= 0) {
                    return;
                }
                const currentDoc = this.activeFileFolder.userData.documents[this.currentDocumentIndex];
                this.animateDocumentFlip(currentDoc, 'out-left')
                    .then(() => {
                        this.currentDocumentIndex--;
                        this.displayCurrentDocument();
                    })
                    .catch(e => console.error("Error showing previous document:", e));
            }

            // NEW: Document flip animation
            animateDocumentFlip(documentMesh, direction) {
                const startRotationY = documentMesh.rotation.y;
                const targetRotationY = startRotationY + (direction === 'out-left' ? Math.PI : -Math.PI);
                const startPositionZ = documentMesh.position.z;
                const targetPositionZ = startPositionZ + 0.3; // Move slightly forward during flip
                const duration = 300;
                const startTime = Date.now();
                const mainMesh = documentMesh.userData.mainMesh;
                const startOpacity = mainMesh.material ? mainMesh.material.opacity : 1;

                this.isGlobalAnimating = true; // Block input during flip
                document.getElementById('container').classList.add('animating-global');

                return new Promise(resolve => {
                    const animate = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const eased = this.easeOutCubic(progress);

                        documentMesh.rotation.y = startRotationY + (targetRotationY - startRotationY) * eased;
                        documentMesh.position.z = startPositionZ + (targetPositionZ - startPositionZ) * eased;
                        if (mainMesh && mainMesh.material) {
                            mainMesh.material.opacity = startOpacity * (1 - eased); // Fade out as it flips
                        }

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            documentMesh.visible = false; // Hide the old document
                            documentMesh.rotation.y = startRotationY; // Reset rotation for next use
                            documentMesh.position.z = startPositionZ; // Reset position
                            if (mainMesh && mainMesh.material) {
                                mainMesh.material.opacity = startOpacity; // Reset opacity
                            }
                            this.isGlobalAnimating = false; // Re-enable input
                            document.getElementById('container').classList.remove('animating-global');
                            resolve();
                        }
                    };
                    animate();
                });
            }

            // Generic position animation (used for drawers and camera)
            animatePosition(object, targetPosition, duration) {
                const startPosition = object.position.clone();
                const startTime = Date.now();
                this.isGlobalAnimating = true; // Block input during this animation
                document.getElementById('container').classList.add('animating-global');

                return new Promise(resolve => {
                    const animate = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const eased = this.easeOutCubic(progress);

                        object.position.lerpVectors(startPosition, targetPosition, eased);

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            object.position.copy(targetPosition);
                            this.isGlobalAnimating = false; // Re-enable input
                            document.getElementById('container').classList.remove('animating-global');
                            resolve();
                        }
                    };
                    animate();
                });
            }

            // Generic object transition (fade, scale, position for artifacts/files/docs)
            animateObjectTransition(object, duration, direction, targetPos = null) {
                const mainMesh = object.userData.mainMesh;
                if (!mainMesh || !mainMesh.material) return Promise.resolve();

                const startOpacity = mainMesh.material.opacity;
                let endOpacity;
                if (direction === 'in') {
                    if (object.name === "document") {
                        endOpacity = 0.95;
                    } else if (object.name === "fileFolder") {
                        endOpacity = object.userData.originalScale * 0.9;
                    } else { // Artifact
                        endOpacity = object.userData.originalScale * 0.85;
                    }
                } else { // 'out' direction
                    endOpacity = 0.0;
                }

                const startScale = object.scale.x;
                const endScale = direction === 'out' ? 0.01 : object.userData.originalScale;

                const startTime = Date.now();
                const initialObjectPos = object.position.clone();

                return new Promise(resolve => {
                    const animate = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const eased = direction === 'out' ? this.easeInCubic(progress) : this.easeOutCubic(progress);

                        mainMesh.material.opacity = startOpacity + (endOpacity - startOpacity) * eased;
                        mainMesh.material.transparent = true;

                        object.scale.setScalar(startScale + (endScale - startScale) * eased);

                        if (targetPos) {
                            object.position.lerpVectors(initialObjectPos, targetPos, eased);
                        }

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            mainMesh.material.opacity = endOpacity;
                            object.scale.setScalar(endScale);
                            if (targetPos) {
                                object.position.copy(targetPos);
                            }
                            if (endOpacity <= 0.01 && direction === 'out') {
                                object.visible = false;
                            }
                            resolve();
                        }
                    };
                    animate();
                });
            }

            easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            easeInCubic(t) {
                return t * t * t;
            }

            updateDebugInfo() {
                if (!this.debugMode) return;

                const now = performance.now();
                this.frameCount++;

                if (now - this.lastFPSUpdate > 1000) {
                    const fps = Math.round((this.frameCount * 1000) / (now - this.lastFPSUpdate));
                    document.getElementById('fps').textContent = fps;
                    this.frameCount = 0;
                    this.lastFPSUpdate = now;
                }
