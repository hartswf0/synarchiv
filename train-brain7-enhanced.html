<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manilla Office Locomotive - Enhanced Physics</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* Base styles from Manilla Office Locomotive */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', monospace;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #E9D7BE;
        }
        
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            color: #E9D7BE;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(233, 215, 190, 0.1);
            border: 1px solid #E9D7BE;
            padding: 15px;
            border-radius: 8px;
            color: #E9D7BE;
            font-size: 14px;
            max-width: 300px;
            backdrop-filter: blur(5px);
            z-index: 100;
            max-height: 95vh;
            overflow-y: auto;
        }
        
        .control-group {
            margin: 10px 0;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(233, 215, 190, 0.2);
        }
        
        .control-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .control-group h3 {
            margin: 0 0 10px 0;
            color: #CCBBAA;
            font-size: 16px;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        
        .slider-container label {
            width: 100px;
            font-size: 12px;
        }
        
        input[type="range"] {
            flex: 1;
            margin: 0 10px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(233, 215, 190, 0.3);
            border-radius: 2px;
            height: 4px;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #E9D7BE;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        .value-display {
            width: 50px;
            text-align: right;
            font-family: monospace;
            font-size: 12px;
        }
        
        button {
            background: #E9D7BE;
            color: #2d2d2d;
            border: none;
            padding: 8px 12px;
            margin: 5px 2px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #CCBBAA;
        }
        
        button.danger {
            background: #f44336;
            color: white;
        }
        
        button.danger:hover {
            background: #d32f2f;
        }
        
        .button-row {
            display: flex;
            gap: 5px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        
        #debug-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #E9D7BE;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Train Physics Simulator - Enhanced</div>
    <div id="ui">
        <div class="control-group">
            <h3>Train Controls</h3>
            <div class="slider-container">
                <label for="speed">Speed:</label>
                <input type="range" id="speed" min="-10" max="10" step="0.1" value="0">
                <span class="value-display" id="speedValue">0.0</span>
            </div>
            <div class="slider-container">
                <label for="trackGauge">Track Gauge:</label>
                <input type="range" id="trackGauge" min="1" max="2" step="0.001" value="1.435">
                <span class="value-display" id="gaugeValue">1.435m</span>
            </div>
            <div class="button-row">
                <button id="addCar">Add Car</button>
                <button id="resetSim" class="danger">Reset</button>
            </div>
            <div class="button-row">
                <button id="topView">Top View</button>
                <button id="sideView">Side View</button>
                <button id="followView">Follow View</button>
            </div>
            <div class="slider-container">
                <label for="physicsQuality">Physics Quality:</label>
                <input type="range" id="physicsQuality" min="1" max="10" step="1" value="5">
                <span class="value-display" id="physicsQualityValue">5</span>
            </div>
        </div>
    </div>
    
    <div id="debug-info">Position: 0.00m | Speed: 0.00</div>
    
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // --- Constants (Manilla Office Theme) ---
        const manillaPaperColor_hex = 0xE9D7BE;
        const darkOfficeGrey_hex = 0x2a2a2a;
        const mediumOfficeGrey_hex = 0x3d3d3d;
        const edgeColor = 0x000000;
        
        // Track parameters
        const trackParams = {
            radius: 15,
            gauge: 1.435,          // Standard gauge in meters
            verticalOffset: 0.2,   // How high the track is off the ground
            sleeperSpacing: 0.5
        };
        
        // Train parameters
        const trainParams = {
            locomotiveLength: 4,
            carLength: 3,
            wheelRadius: 0.5,
            wheelWidth: 0.15,
            maxSpeed: 10,
            acceleration: 2.0,
            brakeForce: 3.0,
            couplerDistance: 0.2
        };
        
        // Physics parameters
        const physicsParams = {
            quality: 5,            // Physics simulation steps per frame (1-10)
            wheelFriction: 0.98,    // How much the wheels resist sliding
            couplerStiffness: 0.5,  // How stiff the couplers are
            couplerDamping: 0.8,    // How much damping to apply to coupler forces
            trackBanking: 0.3,      // How much the train banks on curves (0-1)
            wheelFlangeAngle: 0.1   // How much the wheels can angle on curves (radians)
        };
        
        // Train state
        const trainState = {
            cars: [],
            speed: 0,
            targetSpeed: 0,
            position: 0,
            physicsTime: 0
        };
        
        // Scene setup
        let scene, camera, renderer, controls, clock;
        let trainPathCurve, trainPathTotalLength;
        let currentView = 0; // 0 = orbit, 1 = top, 2 = side, 3 = follow
        
        // Initialize the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 30);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Add orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Create ground and track
            createGround();
            createTrack();
            
            // Add initial train
            addTrainCar(true); // Add locomotive
            
            // Setup event listeners
            window.addEventListener('resize', onWindowResize);
            setupUI();
            
            // Start animation loop
            clock = new THREE.Clock();
            animate();
        }
        
        function createGround() {
            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x3a5f0b,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Grid helper
            const gridHelper = new THREE.GridHelper(100, 50, 0x555555, 0x333333);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
        }
        
        function createTrack() {
            // Clear existing track
            scene.children = scene.children.filter(child => child.userData.type !== 'track');
            
            const railGeometry = new THREE.TorusGeometry(
                trackParams.radius, 
                0.1, // Rail thickness
                8,   // Radial segments
                128  // Tubular segments
            );
            railGeometry.rotateX(-Math.PI / 2);
            
            const railMaterial = new THREE.MeshStandardMaterial({
                color: 0x444444,
                roughness: 0.7,
                metalness: 0.3
            });
            
            // Inner rail
            const innerRail = new THREE.Mesh(railGeometry, railMaterial);
            innerRail.position.y = trackParams.verticalOffset;
            innerRail.userData.type = 'track';
            scene.add(innerRail);
            
            // Outer rail
            const outerRail = new THREE.Mesh(railGeometry, railMaterial);
            outerRail.position.y = trackParams.verticalOffset;
            outerRail.userData.type = 'track';
            outerRail.scale.set(1.1, 1, 1.1);
            scene.add(outerRail);
            
            // Create track path curve
            trainPathCurve = new THREE.EllipseCurve(
                0, 0,
                trackParams.radius, trackParams.radius,
                0, 2 * Math.PI,
                false,
                0
            );
            trainPathTotalLength = trainPathCurve.getLength();
            
            // Add sleepers
            const sleeperGeometry = new THREE.BoxGeometry(2, 0.1, 0.2);
            const sleeperMaterial = new THREE.MeshStandardMaterial({
                color: 0x5D4037,
                roughness: 0.9,
                metalness: 0.1
            });
            
            const numSleepers = 60;
            for (let i = 0; i < numSleepers; i++) {
                const angle = (i / numSleepers) * Math.PI * 2;
                const sleeper = new THREE.Mesh(sleeperGeometry, sleeperMaterial);
                sleeper.position.set(
                    Math.cos(angle) * trackParams.radius,
                    trackParams.verticalOffset - 0.05,
                    Math.sin(angle) * trackParams.radius
                );
                sleeper.rotation.y = -angle;
                sleeper.rotation.x = -Math.PI / 2;
                sleeper.userData.type = 'track';
                sleeper.castShadow = true;
                sleeper.receiveShadow = true;
                scene.add(sleeper);
            }
        }
        
        function createWheel() {
            const wheelGroup = new THREE.Group();
            
            // Wheel geometry
            const wheelGeometry = new THREE.CylinderGeometry(
                trainParams.wheelRadius,
                trainParams.wheelRadius,
                trainParams.wheelWidth,
                32
            );
            
            const wheelMaterial = new THREE.MeshStandardMaterial({
                color: 0x333333,
                roughness: 0.7,
                metalness: 0.3
            });
            
            // Create wheel
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2; // Rotate to align with track
            wheel.castShadow = true;
            wheel.receiveShadow = true;
            
            // Add wheel to group
            wheelGroup.add(wheel);
            
            // Add wheel flange
            const flangeGeometry = new THREE.TorusGeometry(
                trainParams.wheelRadius * 0.8,
                trainParams.wheelWidth * 0.6,
                8,
                16
            );
            const flangeMaterial = new THREE.MeshStandardMaterial({
                color: 0x555555,
                roughness: 0.7,
                metalness: 0.3
            });
            const flange = new THREE.Mesh(flangeGeometry, flangeMaterial);
            flange.position.x = trainParams.wheelWidth * 0.5;
            flange.rotation.y = Math.PI / 2;
            wheelGroup.add(flange);
            
            return wheelGroup;
        }
        
        function addTrainCar(isLocomotive = false) {
            const carGroup = new THREE.Group();
            
            // Car body
            const bodyLength = isLocomotive ? trainParams.locomotiveLength : trainParams.carLength;
            const bodyGeometry = new THREE.BoxGeometry(bodyLength, 1, 1.5);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: isLocomotive ? 0x4CAF50 : 0x2196F3,
                roughness: 0.7,
                metalness: 0.3
            });
            
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = trainParams.wheelRadius + 0.5;
            body.castShadow = true;
            body.receiveShadow = true;
            carGroup.add(body);
            
            // Add wheels
            const wheels = [];
            const wheelPositions = [
                { x: -bodyLength * 0.4, y: trainParams.wheelRadius, z: 0.75 },
                { x: bodyLength * 0.4, y: trainParams.wheelRadius, z: 0.75 },
                { x: -bodyLength * 0.4, y: trainParams.wheelRadius, z: -0.75 },
                { x: bodyLength * 0.4, y: trainParams.wheelRadius, z: -0.75 }
            ];
            
            wheelPositions.forEach(pos => {
                const wheel = createWheel();
                wheel.position.set(pos.x, pos.y, pos.z);
                wheels.push(wheel);
                carGroup.add(wheel);
            });
            
            // Add couplers
            const couplerGeometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const couplerMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            const frontCoupler = new THREE.Mesh(couplerGeometry, couplerMaterial);
            frontCoupler.position.set(bodyLength * 0.5, trainParams.wheelRadius + 0.1, 0);
            carGroup.add(frontCoupler);
            
            const rearCoupler = new THREE.Mesh(couplerGeometry, couplerMaterial);
            rearCoupler.position.set(-bodyLength * 0.5, trainParams.wheelRadius + 0.1, 0);
            carGroup.add(rearCoupler);
            
            // Add to scene and train state
            scene.add(carGroup);
            
            // Calculate initial position along the track
            const initialPosition = (trainState.cars.length * (trainParams.carLength + trainParams.couplerDistance)) % trainPathTotalLength;
            
            trainState.cars.push({
                group: carGroup,
                wheels: wheels,
                length: isLocomotive ? trainParams.locomotiveLength : trainParams.carLength,
                isLocomotive: isLocomotive,
                position: initialPosition,
                velocity: 0,
                frontCoupler: frontCoupler,
                rearCoupler: rearCoupler
            });
            
            return carGroup;
        }
        
        function updateTrainPhysics(deltaTime) {
            const physicsSteps = Math.max(1, physicsParams.quality);
            const stepDelta = deltaTime / physicsSteps;
            
            for (let step = 0; step < physicsSteps; step++) {
                // Update each car's physics
                for (let i = 0; i < trainState.cars.length; i++) {
                    const car = trainState.cars[i];
                    const isFirstCar = i === 0;
                    const isLastCar = i === trainState.cars.length - 1;
                    
                    // Apply acceleration if this is the locomotive
                    if (car.isLocomotive) {
                        // Simple acceleration/deceleration based on target speed
                        const targetSpeed = trainState.targetSpeed;
                        const currentSpeed = trainState.speed;
                        const acceleration = targetSpeed > currentSpeed ? 
                            trainParams.acceleration : -trainParams.brakeForce;
                        
                        trainState.speed = THREE.MathUtils.lerp(
                            currentSpeed,
                            targetSpeed,
                            1 - Math.exp(-acceleration * stepDelta)
                        );
                        
                        // Update position along track
                        trainState.position = (trainState.position + trainState.speed * stepDelta) % trainPathTotalLength;
                        if (trainState.position < 0) trainState.position += trainPathTotalLength;
                    }
                    
                    // Calculate position along track
                    const pathU = (car.position / trainPathTotalLength) % 1;
                    const pathPoint = trainPathCurve.getPoint(pathU);
                    const pathTangent = trainPathCurve.getTangent(pathU);
                    const pathNormal = new THREE.Vector3(-pathTangent.y, 0, pathTangent.x).normalize();
                    
                    // Apply banking based on curve
                    const bankAngle = pathTangent.lengthSq() * physicsParams.trackBanking;
                    const bankAxis = pathTangent.clone().normalize();
                    
                    // Update car position and rotation
                    car.group.position.set(pathPoint.x, trackParams.verticalOffset + trainParams.wheelRadius, pathPoint.y);
                    
                    // Calculate target rotation (facing along tangent)
                    const targetQuaternion = new THREE.Quaternion();
                    targetQuaternion.setFromUnitVectors(
                        new THREE.Vector3(0, 0, 1), // Default forward
                        new THREE.Vector3(pathTangent.x, 0, pathTangent.y).normalize()
                    );
                    
                    // Apply banking
                    const bankQuaternion = new THREE.Quaternion()
                        .setFromAxisAngle(bankAxis, bankAngle);
                    targetQuaternion.multiply(bankQuaternion);
                    
                    // Smoothly interpolate rotation
                    car.group.quaternion.slerp(targetQuaternion, 0.2);
                    
                    // Update wheel rotations
                    const wheelRotation = (trainState.speed / trainParams.wheelRadius) * stepDelta;
                    car.wheels.forEach(wheel => {
                        wheel.rotation.x += wheelRotation;
                    });
                    
                    // Update couplers
                    if (!isFirstCar) {
                        const prevCar = trainState.cars[i - 1];
                        const distance = prevCar.group.position.distanceTo(car.group.position);
                        const targetDistance = (prevCar.length + car.length) * 0.5 + trainParams.couplerDistance;
                        
                        if (distance > targetDistance) {
                            const force = (distance - targetDistance) * physicsParams.couplerStiffness;
                            const direction = car.group.position.clone().sub(prevCar.group.position).normalize();
                            
                            // Apply forces to both cars
                            car.velocity -= force * stepDelta * physicsParams.couplerDamping;
                            prevCar.velocity += force * stepDelta * physicsParams.couplerDamping;
                        }
                    }
                    
                    // Update car position based on velocity
                    car.position = (car.position + car.velocity * stepDelta) % trainPathTotalLength;
                    if (car.position < 0) car.position += trainPathTotalLength;
                }
                
                // Update positions based on velocities
                for (const car of trainState.cars) {
                    car.position = (car.position + car.velocity * stepDelta) % trainPathTotalLength;
                    if (car.position < 0) car.position += trainPathTotalLength;
                }
            }
        }
        
        function updateCamera() {
            if (trainState.cars.length === 0) return;
            
            const targetCar = trainState.cars[0]; // Follow the first car
            const carPosition = targetCar.group.position;
            
            switch (currentView) {
                case 0: // Orbit view
                    // Let OrbitControls handle the camera
                    break;
                    
                case 1: // Top view
                    camera.position.set(0, 30, 0);
                    camera.lookAt(0, 0, 0);
                    break;
                    
                case 2: // Side view
                    camera.position.set(30, 10, 0);
                    camera.lookAt(0, 5, 0);
                    break;
                    
                case 3: // Follow view
                    const forward = new THREE.Vector3();
                    targetCar.group.getWorldDirection(forward);
                    forward.negate();
                    
                    const cameraDistance = 10;
                    const cameraHeight = 5;
                    
                    const targetPosition = carPosition.clone()
                        .add(forward.multiplyScalar(cameraDistance))
                        .add(new THREE.Vector3(0, cameraHeight, 0));
                    
                    camera.position.lerp(targetPosition, 0.1);
                    camera.lookAt(carPosition);
                    break;
            }
        }
        
        function setupUI() {
            // Speed control
            const speedInput = document.getElementById('speed');
            const speedValue = document.getElementById('speedValue');
            
            speedInput.addEventListener('input', (e) => {
                const speed = parseFloat(e.target.value);
                speedValue.textContent = speed.toFixed(1);
                trainState.targetSpeed = speed * 0.1;
            });
            
            // Track gauge control
            const gaugeInput = document.getElementById('trackGauge');
            const gaugeValue = document.getElementById('gaugeValue');
            
            gaugeInput.addEventListener('input', (e) => {
                const gauge = parseFloat(e.target.value);
                gaugeValue.textContent = gauge.toFixed(3) + 'm';
                trackParams.gauge = gauge;
                createTrack();
            });
            
            // Physics quality
            const physicsQualityInput = document.getElementById('physicsQuality');
            const physicsQualityValue = document.getElementById('physicsQualityValue');
            
            physicsQualityInput.addEventListener('input', (e) => {
                const quality = parseInt(e.target.value);
                physicsQualityValue.textContent = quality;
                physicsParams.quality = quality;
            });
            
            // Buttons
            document.getElementById('addCar').addEventListener('click', () => {
                addTrainCar();
            });
            
            document.getElementById('resetSim').addEventListener('click', () => {
                // Reset train state
                trainState.cars.forEach(car => scene.remove(car.group));
                trainState.cars = [];
                trainState.speed = 0;
                trainState.targetSpeed = 0;
                trainState.position = 0;
                
                // Add new locomotive
                addTrainCar(true);
                
                // Reset UI
                speedInput.value = 0;
                speedValue.textContent = '0.0';
            });
            
            // View buttons
            document.getElementById('topView').addEventListener('click', () => {
                currentView = 1;
                updateCamera();
            });
            
            document.getElementById('sideView').addEventListener('click', () => {
                currentView = 2;
                updateCamera();
            });
            
            document.getElementById('followView').addEventListener('click', () => {
                currentView = 3;
                updateCamera();
            });
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min(0.1, clock.getDelta());
            
            // Update physics
            updateTrainPhysics(deltaTime);
            
            // Update camera
            updateCamera();
            
            // Update controls if needed
            if (currentView === 0) {
                controls.update();
            }
            
            // Update debug info
            const debugInfo = document.getElementById('debug-info');
            if (debugInfo) {
                debugInfo.textContent = `Position: ${trainState.position.toFixed(2)}m | ` +
                                      `Speed: ${(trainState.speed * 10).toFixed(2)} | ` +
                                      `Cars: ${trainState.cars.length}`;
            }
            
            // Render scene
            renderer.render(scene, camera);
        }
        
        // Start the application
        init();
    </script>
</body>
</html>
