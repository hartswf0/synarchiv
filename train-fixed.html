<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Train Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a1a; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px;
            font-family: monospace;
            z-index: 100;
        }
        #debug { 
            position: absolute; bottom: 10px; left: 10px;
            color: white; font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 3px;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 5px 10px;
            margin: 5px 2px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        input[type="range"] { width: 100px; margin: 0 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <div>Speed: <input type="range" id="speed" min="-10" max="10" step="0.1" value="0">
        <span id="speedValue">0.0</span></div>
        <div>Track Radius: <input type="range" id="trackRadius" min="10" max="30" step="1" value="15">
        <span id="radiusValue">15</span>m</div>
        <button id="addCar">Add Car</button>
        <button id="reset">Reset</button>
    </div>
    <div id="debug">Ready</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 30);
        camera.lookAt(0, 0, 0);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Track parameters
        let trackRadius = 15;
        const trackWidth = 2;
        const railRadius = 0.2;
        const railSegments = 32;
        
        // Train parameters
        const carLength = 3;
        const couplingDistance = 0.5;
        const wheelRadius = 0.5;
        const wheelThickness = 0.3;
        
        // Train state
        const trainCars = [];
        let targetSpeed = 0;
        let currentSpeed = 0;
        let trainPath = null;
        let trainPathLength = 0;
        
        // Create track
        function createTrack() {
            // Clear existing track
            scene.children = scene.children.filter(obj => obj.type !== 'Mesh' || obj.userData.type !== 'track');
            
            // Create circular path for train
            const points = [];
            const segments = 64;
            
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(
                    Math.cos(angle) * trackRadius,
                    0,
                    Math.sin(angle) * trackRadius
                ));
            }
            
            // Create smooth curve
            trainPath = new THREE.CatmullRomCurve3(points, true);
            trainPathLength = trainPath.getLength();
            
            // Create rails
            const railGeometry = new THREE.TorusGeometry(trackRadius, railRadius, 8, 64);
            railGeometry.rotateX(-Math.PI / 2);
            
            const railMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            
            // Inner rail
            const innerRail = new THREE.Mesh(railGeometry, railMaterial);
            innerRail.position.y = 0.1;
            innerRail.userData.type = 'track';
            scene.add(innerRail);
            
            // Outer rail
            const outerRail = new THREE.Mesh(railGeometry, railMaterial);
            outerRail.position.y = 0.1;
            outerRail.scale.set(1.1, 1, 1.1);
            outerRail.userData.type = 'track';
            scene.add(outerRail);
            
            // Add sleepers
            const sleeperGeometry = new THREE.BoxGeometry(2, 0.1, 0.5);
            const sleeperMaterial = new THREE.MeshStandardMaterial({ color: 0x5D4037 });
            
            const numSleepers = 60;
            for (let i = 0; i < numSleepers; i++) {
                const angle = (i / numSleepers) * Math.PI * 2;
                const sleeper = new THREE.Mesh(sleeperGeometry, sleeperMaterial);
                sleeper.position.set(
                    Math.cos(angle) * trackRadius,
                    0.05,
                    Math.sin(angle) * trackRadius
                );
                sleeper.rotation.y = -angle;
                sleeper.rotation.x = -Math.PI / 2;
                sleeper.userData.type = 'track';
                sleeper.castShadow = true;
                sleeper.receiveShadow = true;
                scene.add(sleeper);
            }
        }
        
        // Create a wheel
        function createWheel() {
            const wheelGroup = new THREE.Group();
            
            // Wheel
            const wheelGeometry = new THREE.CylinderGeometry(
                wheelRadius, wheelRadius, wheelThickness, 16
            );
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2;
            wheel.castShadow = true;
            wheelGroup.add(wheel);
            
            return wheelGroup;
        }
        
        // Create a train car
        function createCar(isLocomotive = false) {
            const carGroup = new THREE.Group();
            
            // Car body
            const bodyLength = isLocomotive ? 4 : 3;
            const bodyGeometry = new THREE.BoxGeometry(bodyLength, 1, 1.5);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: isLocomotive ? 0x4CAF50 : 0x2196F3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.75;
            body.castShadow = true;
            body.receiveShadow = true;
            carGroup.add(body);
            
            // Wheels
            const wheelPositions = [
                { x: -bodyLength/2 + 0.5, z: 0.6 },
                { x: bodyLength/2 - 0.5, z: 0.6 },
                { x: -bodyLength/2 + 0.5, z: -0.6 },
                { x: bodyLength/2 - 0.5, z: -0.6 }
            ];
            
            const wheels = [];
            wheelPositions.forEach(pos => {
                const wheel = createWheel();
                wheel.position.set(pos.x, 0.3, pos.z);
                wheel.rotation.z = Math.PI / 2;
                carGroup.add(wheel);
                wheels.push(wheel);
            });
            
            // Position the car on the track
            carGroup.position.y = 0.7;
            carGroup.userData = {
                isLocomotive,
                wheels,
                position: 0,
                speed: 0,
                length: bodyLength
            };
            
            return carGroup;
        }
        
        // Add a new car to the train
        function addCar() {
            if (trainCars.length >= 5) return; // Limit number of cars
            
            const isLocomotive = trainCars.length === 0;
            const car = createCar(isLocomotive);
            
            if (trainCars.length > 0) {
                // Position the new car behind the last car
                const lastCar = trainCars[trainCars.length - 1];
                car.position.copy(lastCar.position);
                car.rotation.copy(lastCar.rotation);
                
                // Move it back by the length of the last car plus coupling distance
                const offset = new THREE.Vector3(0, 0, -lastCar.userData.length/2 - car.userData.length/2 - couplingDistance);
                offset.applyQuaternion(lastCar.quaternion);
                car.position.add(offset);
            }
            
            scene.add(car);
            trainCars.push(car);
            return car;
        }
        
        // Reset the simulation
        function reset() {
            // Remove all cars
            trainCars.forEach(car => scene.remove(car));
            trainCars.length = 0;
            
            // Reset speed
            targetSpeed = 0;
            currentSpeed = 0;
            document.getElementById('speed').value = 0;
            document.getElementById('speedValue').textContent = '0.0';
            
            // Recreate track and add initial car
            createTrack();
            addCar();
        }
        
        // Update train physics and positions
        function updateTrain(deltaTime) {
            if (trainCars.length === 0) return;
            
            // Update speed with smooth acceleration
            currentSpeed += (targetSpeed - currentSpeed) * 0.1;
            
            // Update each car's position
            for (let i = 0; i < trainCars.length; i++) {
                const car = trainCars[i];
                const data = car.userData;
                
                // Calculate position along track
                data.position = (data.position + currentSpeed * deltaTime) % trainPathLength;
                if (data.position < 0) data.position += trainPathLength;
                
                // Get position and tangent at this point
                const t = data.position / trainPathLength;
                const point = trainPath.getPoint(t);
                const tangent = trainPath.getTangent(t);
                
                // Update car position and rotation
                car.position.copy(point);
                car.position.y = 0.7; // Slightly above track
                
                // Calculate target rotation (facing along tangent)
                const targetRotation = Math.atan2(tangent.x, tangent.z);
                car.rotation.y = targetRotation;
                
                // Rotate wheels
                const wheelRotation = (currentSpeed / wheelRadius) * deltaTime;
                data.wheels.forEach(wheel => {
                    wheel.rotation.x += wheelRotation;
                });
                
                // Update debug info
                if (i === 0) {
                    document.getElementById('debug').textContent = 
                        `Speed: ${currentSpeed.toFixed(2)} | Position: ${data.position.toFixed(2)}`;
                }
            }
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min(0.05, clock.getDelta());
            
            // Update train
            updateTrain(deltaTime);
            
            // Render scene
            renderer.render(scene, camera);
        }
        
        // Initialize
        const clock = new THREE.Clock();
        createTrack();
        addCar(); // Add initial locomotive
        
        // UI Event Listeners
        document.getElementById('speed').addEventListener('input', (e) => {
            targetSpeed = parseFloat(e.target.value) * 0.1;
            document.getElementById('speedValue').textContent = e.target.value;
        });
        
        document.getElementById('trackRadius').addEventListener('input', (e) => {
            trackRadius = parseFloat(e.target.value);
            document.getElementById('radiusValue').textContent = e.target.value;
            reset();
        });
        
        document.getElementById('addCar').addEventListener('click', addCar);
        document.getElementById('reset').addEventListener('click', reset);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start animation
        animate();
    </script>
</body>
</html>
