<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Physics v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
            color: #fff;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }
        
        .slider-container {
            margin: 10px 0;
        }
        
        .slider-container label {
            display: inline-block;
            width: 120px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            margin: 5px 2px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="slider-container">
            <label for="speed">Speed:</label>
            <input type="range" id="speed" min="-5" max="5" step="0.1" value="0">
            <span id="speedValue">0.0</span>
        </div>
        
        <div class="slider-container">
            <label for="trackCurvature">Track Curvature:</label>
            <input type="range" id="trackCurvature" min="0" max="1" step="0.01" value="0">
        </div>
        
        <div class="slider-container">
            <label for="trackGauge">Track Gauge:</label>
            <input type="range" id="trackGauge" min="1" max="2" step="0.001" value="1.435">
            <span id="gaugeValue">1.435m</span>
        </div>
        
        <button id="resetBtn">Reset</button>
        <button id="topView">Top View</button>
        <button id="sideView">Side View</button>
    </div>
    
    <div id="info">Position: 0.00m | Speed: 0.00</div>
    
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Main variables
        let scene, camera, renderer, controls;
        let train, wheels = [];
        let track = [];
        let clock = new THREE.Clock();
        
        // Track parameters
        const trackParams = {
            gauge: 1.435,      // Standard gauge in meters
            length: 40,        // Total track length
            curvature: 0,      // 0 = straight, 1 = full circle
            sleeperSpacing: 0.5,
            sleepers: []
        };
        
        // Wheel parameters
        const wheelParams = {
            radius: 0.5,
            width: 0.15,
            flangeHeight: 0.08,
            flangeWidth: 0.1
        };
        
        // Train state
        const trainState = {
            position: 0,
            speed: 0,
            targetSpeed: 0,
            angle: 0
        };
        
        // Initialize the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 15);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // Add orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Create ground and track
            createGround();
            createTrack();
            createTrain();
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            setupUI();
        }
        
        function createGround() {
            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x3a5f0b,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Grid helper
            const gridHelper = new THREE.GridHelper(50, 50, 0x555555, 0x333333);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);
        }
        
        function createTrack() {
            // Clear existing track
            track.forEach(obj => scene.remove(obj));
            trackParams.sleepers.forEach(sleeper => scene.remove(sleeper));
            track = [];
            trackParams.sleepers = [];
            
            const railGeometry = new THREE.BoxGeometry(0.1, 0.1, trackParams.length);
            const railMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x444444,
                roughness: 0.7,
                metalness: 0.3
            });
            
            const sleeperGeometry = new THREE.BoxGeometry(trackParams.gauge + 0.4, 0.1, 0.2);
            const sleeperMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x5D4037,
                roughness: 0.9,
                metalness: 0.1
            });
            
            // Calculate curve parameters
            const curveRadius = trackParams.length / (2 * Math.PI * trackParams.curvature) || 0;
            const curveAngle = trackParams.length * trackParams.curvature * 0.5;
            
            // Create multiple track segments
            const segments = 20;
            const segmentLength = trackParams.length / segments;
            
            for (let i = 0; i < segments; i++) {
                const t = i / segments;
                const angle = t * curveAngle * 2 - curveAngle;
                const x = curveRadius * Math.sin(angle) || 0;
                const z = t * trackParams.length - trackParams.length/2;
                
                // Left rail
                const leftRail = new THREE.Mesh(railGeometry, railMaterial);
                leftRail.position.set(x - trackParams.gauge/2, 0.05, z);
                leftRail.rotation.y = angle * trackParams.curvature;
                leftRail.castShadow = true;
                leftRail.receiveShadow = true;
                scene.add(leftRail);
                track.push(leftRail);
                
                // Right rail
                const rightRail = new THREE.Mesh(railGeometry, railMaterial);
                rightRail.position.set(x + trackParams.gauge/2, 0.05, z);
                rightRail.rotation.y = angle * trackParams.curvature;
                rightRail.castShadow = true;
                rightRail.receiveShadow = true;
                scene.add(rightRail);
                track.push(rightRail);
                
                // Sleepers
                if (i % 2 === 0) {
                    const sleeper = new THREE.Mesh(sleeperGeometry, sleeperMaterial);
                    sleeper.position.set(x, 0.05, z);
                    sleeper.rotation.y = angle * trackParams.curvature;
                    sleeper.castShadow = true;
                    sleeper.receiveShadow = true;
                    scene.add(sleeper);
                    trackParams.sleepers.push(sleeper);
                }
            }
        }
        
        function createWheel(x, y, z) {
            const group = new THREE.Group();
            
            // Wheel geometry
            const wheelGeometry = new THREE.CylinderGeometry(
                wheelParams.radius, 
                wheelParams.radius, 
                wheelParams.width, 
                32
            );
            
            const wheelMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.7,
                metalness: 0.3
            });
            
            // Create wheel
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2; // Rotate to align with track
            wheel.castShadow = true;
            wheel.receiveShadow = true;
            
            // Add wheel to group
            group.add(wheel);
            
            // Position the group
            group.position.set(x, y, z);
            
            return group;
        }
        
        function createTrain() {
            // Clear existing wheels
            wheels.forEach(wheel => scene.remove(wheel));
            if (train) scene.remove(train);
            
            wheels = [];
            
            // Create wheels
            const wheelPositions = [
                { x: -trackParams.gauge/2, y: wheelParams.radius, z: -1 },
                { x: trackParams.gauge/2, y: wheelParams.radius, z: -1 },
                { x: -trackParams.gauge/2, y: wheelParams.radius, z: 1 },
                { x: trackParams.gauge/2, y: wheelParams.radius, z: 1 }
            ];
            
            wheelPositions.forEach(pos => {
                const wheel = createWheel(pos.x, pos.y, pos.z);
                wheels.push(wheel);
                scene.add(wheel);
            });
            
            // Create train body
            const bodyGeometry = new THREE.BoxGeometry(2, 1, 4);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x4CAF50,
                roughness: 0.7,
                metalness: 0.3
            });
            
            train = new THREE.Mesh(bodyGeometry, bodyMaterial);
            train.position.y = 1.5;
            train.castShadow = true;
            train.receiveShadow = true;
            scene.add(train);
            
            // Reset train state
            trainState.position = 0;
            trainState.speed = 0;
            trainState.targetSpeed = 0;
            trainState.angle = 0;
        }
        
        function updateTrain(delta) {
            // Update speed (simple acceleration)
            const acceleration = (trainState.targetSpeed - trainState.speed) * 0.1;
            trainState.speed += acceleration * delta;
            
            // Update position
            trainState.position += trainState.speed * delta;
            
            // Wrap around track
            if (Math.abs(trainState.position) > trackParams.length / 2) {
                trainState.position = -Math.sign(trainState.position) * trackParams.length / 2;
            }
            
            // Calculate curve angle at current position
            const curveAngle = (trainState.position / trackParams.length) * (trackParams.curvature * Math.PI * 2);
            const curveRadius = trackParams.length / (2 * Math.PI * trackParams.curvature) || 0;
            
            // Calculate position along curve
            let x = 0, z = trainState.position;
            if (trackParams.curvature > 0.01) {
                x = curveRadius * Math.sin(curveAngle);
                z = curveRadius * (1 - Math.cos(curveAngle)) - trackParams.length/2;
            }
            
            // Update wheel rotations
            const rotationSpeed = trainState.speed / (wheelParams.radius * 2);
            
            // Update wheel positions and rotations
            wheels.forEach((wheel, i) => {
                // Calculate wheel position relative to train
                const relX = i < 2 ? -1 : 1; // Front or back
                const side = i % 2 === 0 ? -1 : 1; // Left or right
                
                // Calculate wheel angle
                const wheelAngle = curveAngle * trackParams.curvature * relX * 0.5;
                
                // Position wheels
                wheel.position.x = x + Math.sin(wheelAngle) * trackParams.gauge/2 * side;
                wheel.position.z = z + Math.cos(wheelAngle) * trackParams.gauge/2 * side * relX;
                
                // Rotate wheels
                wheel.rotation.x += rotationSpeed * delta * Math.PI * 2;
                wheel.rotation.y = wheelAngle * side;
            });
            
            // Update train body
            if (train) {
                train.position.set(x, 1.5, z);
                train.rotation.y = curveAngle * trackParams.curvature;
            }
            
            // Update info display
            document.getElementById('info').textContent = 
                `Position: ${trainState.position.toFixed(2)}m | ` +
                `Speed: ${(trainState.speed * 10).toFixed(2)}`;
        }
        
        function setupUI() {
            const speedInput = document.getElementById('speed');
            const speedValue = document.getElementById('speedValue');
            const curveInput = document.getElementById('trackCurvature');
            const gaugeInput = document.getElementById('trackGauge');
            
            // Speed control
            speedInput.addEventListener('input', (e) => {
                const speed = parseFloat(e.target.value);
                speedValue.textContent = speed.toFixed(1);
                trainState.targetSpeed = speed * 0.1;
            });
            
            // Curve amount control
            curveInput.addEventListener('input', (e) => {
                trackParams.curvature = parseFloat(e.target.value);
                createTrack();
                createTrain();
            });
            
            // Gauge control
            gaugeInput.addEventListener('input', (e) => {
                trackParams.gauge = parseFloat(e.target.value);
                document.getElementById('gaugeValue').textContent = trackParams.gauge.toFixed(3) + 'm';
                createTrack();
                createTrain();
            });
            
            // Reset button
            document.getElementById('resetBtn').addEventListener('click', () => {
                trainState.position = 0;
                trainState.speed = 0;
                trainState.targetSpeed = 0;
                trainState.angle = 0;
                speedInput.value = 0;
                speedValue.textContent = '0.0';
                createTrain();
            });
            
            // View controls
            document.getElementById('topView').addEventListener('click', () => {
                camera.position.set(0, 15, 0);
                camera.lookAt(0, 0, 0);
                camera.rotation.z = 0;
            });
            
            document.getElementById('sideView').addEventListener('click', () => {
                camera.position.set(15, 5, 0);
                camera.lookAt(0, 1, 0);
            });
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(0.1, clock.getDelta());
            
            // Update train
            updateTrain(delta);
            
            // Update controls
            controls.update();
            
            // Render scene
            renderer.render(scene, camera);
        }
        
        // Start the application
        init();
        animate();
    </script>
</body>
</html>
