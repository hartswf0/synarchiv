<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manilla Office Locomotive</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #E9D7BE;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(233, 215, 190, 0.1);
            border: 1px solid #E9D7BE;
            padding: 15px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            z-index: 100;
        }

        #controls div:first-child { /* Title */
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #E9D7BE;
        }

        #info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(233, 215, 190, 0.1);
            border: 1px solid #E9D7BE;
            padding: 15px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            z-index: 100;
            max-width: 300px;
        }

        #info div:first-child { /* Title */
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #E9D7BE;
        }
        #currentEra, #trainInfo {
            font-size: 14px;
            color: rgba(233, 215, 190, 0.8);
        }

        button {
            background: #E9D7BE;
            color: #2d2d2d;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }

        button:hover {
            background: #CCBBAA;
        }

        input[type="range"] {
            width: 100px;
            margin: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(233, 215, 190, 0.3);
            border-radius: 2px;
            height: 4px;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #E9D7BE;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #E9D7BE;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        #dialogue {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(233, 215, 190, 0.15); /* Manilla translucent */
            color: #E9D7BE; /* Manilla text */
            border: 2px solid #CCBBAA; /* Darker Manilla border */
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            width: 80vw;
            max-height: 70vh;
            overflow-y: hidden; /* Control scrolling manually */
            display: none;
            z-index: 1000;
            backdrop-filter: blur(10px);
            font-family: 'Courier New', monospace;
            flex-direction: column; /* Use flexbox for layout */
            gap: 10px;
        }

        #dialogue.active {
            display: flex;
        }

        #dialogue h3 {
            margin-top: 0;
            color: #CCBBAA;
            font-size: 18px;
            text-align: center;
            border-bottom: 1px solid rgba(233, 215, 190, 0.3);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        #messageHistory {
            flex-grow: 1; /* Allows history to take available height */
            max-height: 300px; /* Max height for scrollable area */
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid rgba(233, 215, 190, 0.3);
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .message {
            margin: 5px 0; /* Reduced margin */
            padding: 8px; /* Reduced padding */
            border-radius: 5px;
            font-size: 13px;
        }

        .message.era {
            background: rgba(180, 160, 140, 0.2); /* Muted manilla tone */
            border-left: 4px solid #CCBBAA; /* Darker manilla accent */
            text-align: left;
        }

        .message.user {
            background: rgba(140, 160, 180, 0.2); /* Muted cool tone */
            border-left: 4px solid #AABBCB; /* Darker cool accent */
            text-align: right;
        }

        #userInput {
            width: calc(100% - 20px); /* Adjust width for padding */
            padding: 10px;
            border: 1px solid #CCBBAA;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.4);
            color: #E9D7BE;
            font-family: inherit;
            margin-bottom: 10px;
        }

        #sendMessage {
            width: 100%;
            background: #E9D7BE;
            color: #2d2d2d;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        #sendMessage:hover {
            background: #f5e8d5;
            transform: translateY(-1px);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            color: #E9D7BE;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .close-btn:hover {
            background: rgba(233, 215, 190, 0.2);
            color: #f5e8d5;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <div><strong>Manilla Office Locomotive</strong></div>
            <button id="toggleView">Toggle View</button>
            <button id="focusCar">Focus Car</button>
            <button id="talkToEra">Talk to Era</button>
            <div>
                <label>Speed: </label>
                <input type="range" id="speedControl" min="0.1" max="3" step="0.1" value="1">
                <span id="speedDisplay">1.0x</span>
            </div>
        </div>

        <div id="info">
            <div><strong>Cultural Memory Express</strong></div>
            <div id="currentEra">Era: Print Media</div>
            <div id="trainInfo">Cars: 4 | Speed: Normal</div>
            <div style="margin-top: 10px; font-size: 11px; opacity: 0.7;">
                Click on train cars to interact with different media eras
            </div>
        </div>

        <div id="dialogue">
            <button class="close-btn" id="closeDialogue">×</button>
            <h3 id="dialogueTitle">Conversation with Print Era</h3>
            <div id="messageHistory"></div>
            <input type="text" id="userInput" placeholder="Type your message..." />
            <button id="sendMessage">Send</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Constants
        const manillaPaperColor_hex = 0xE9D7BE;
        const darkOfficeGrey_hex = 0x2a2a2a;
        const mediumOfficeGrey_hex = 0x3d3d3d;
        const lightOfficeGrey_hex = 0x4a4a4a;
        const edgeColor_hex = 0xCCBBAA;
        const couplingColor_hex = 0xCCBBAA;
        const groundColor_hex = 0x2a2a2a;

        const manillaPaperColor = new THREE.Color(manillaPaperColor_hex);
        const darkOfficeGrey = new THREE.Color(darkOfficeGrey_hex);
        const mediumOfficeGrey = new THREE.Color(mediumOfficeGrey_hex);
        const lightOfficeGrey = new THREE.Color(lightOfficeGrey_hex);
        const edgeColor = new THREE.Color(edgeColor_hex);
        const couplingColor = new THREE.Color(couplingColor_hex);
        const groundColor = new THREE.Color(groundColor_hex);


        const trackRadius = 50;
        const locomotiveLength = 10; // Adjusted from 8 to provide more realistic spacing
        const carLength = 10;       // Adjusted from 6 for consistent spacing between cars
        
        // Base wheel geometry dimensions (from your debug JSON, before scaling)
        const baseWheelRadius = 1;
        const baseWheelThickness = 0.3;

        // Scaling factor for wheels (from your debug JSON)
        const wheelScaleFactor = 0.5;

        // Effective wheel dimensions after scaling
        const effectiveWheelRadius = baseWheelRadius * wheelScaleFactor;
        const effectiveWheelThickness = baseWheelThickness * wheelScaleFactor;

        // Wheel static orientation (from your debug JSON)
        const wheelStaticRotX = 90 * (Math.PI / 180);
        const wheelStaticRotY = 0 * (Math.PI / 180);
        const wheelStaticRotZ = 0 * (Math.PI / 180);

        // Wheel dynamic rolling axis (from your debug JSON)
        const wheelRollingAxis = 'y'; // 'x', 'y', or 'z'


        // Global variables
        let scene, camera, renderer, clock;
        let locomotive, trainCars = [];
        let trainAngle = 0;
        let speedMultiplier = 1;
        let currentView = 0;
        let currentCarFocus = 0;
        let currentEra = 'Print'; // Initial era for dialogue

        // Media eras data (colors converted to hex for use in new THREE.Color())
        const mediaEras = {
            'Print': {
                color: 0x8B4513, // Original Brown
                symbols: 'books',
                personality: "Greetings, inquirer. I am the bearer of permanence, the keeper of standardized knowledge. Through my mechanical precision, I transformed fleeting thoughts into enduring texts. What wisdom do you seek from the age of ink and paper?",
                responses: {
                    "knowledge": "Knowledge, you say? I democratized it! Before me, wisdom was hoarded in monasteries and courts. I made every home a library, every reader a scholar. Yet I also standardized truth - what was printed became canon.",
                    "technology": "My technology was revolution disguised as craft. Moving type, mechanical presses, uniform letters - I transformed writing from art to industry. I am both the death of scribal beauty and the birth of mass enlightenment.",
                    "society": "I reshaped society more than kings or wars ever could. I created the public sphere, enabled the Reformation, sparked the Enlightenment. Yet I also created orthodoxy - the tyranny of the published word.",
                    "future": "The future? I see echoes of myself in every medium that follows. They all seek what I first achieved - the reproduction and distribution of human thought. But none match my permanence, my authority.",
                    "change": "Change comes through me slowly, deliberately. I am the marathon runner of media - not swift, but enduring. I build consensus through repeated exposure, through the weight of accumulated wisdom.",
                    "memory": "I AM cultural memory made manifest. Before me, memory was fleeting, personal, oral. I made memory external, permanent, shareable. I am the first technology to truly defeat time."
                }
            },
            'Radio': {
                color: 0x4169E1, // Original Royal Blue
                symbols: 'waves',
                personality: "Hello there, friend! Can you hear me? I'm broadcasting from everywhere and nowhere, riding the invisible waves that connect us all. I brought voices into homes, created the first electronic intimacy. What frequency are you tuned to today?",
                responses: {
                    "knowledge": "Knowledge through me is immediate, intimate, alive! No more dusty books - I bring voices, music, news directly to your ear. I make information feel personal, even when it's mass-distributed. I'm the first medium that feels like a friend.",
                    "technology": "I'm pure magic - invisible waves carrying human voices across vast distances! I proved that information doesn't needs physical form. I'm the bridge between the mechanical and the electronic age, between text and pure signal.",
                    "society": "I unified nations through shared experiences - everyone hearing Roosevelt's fireside chats, gathering around the radio for war news, music, drama. I created the first truly simultaneous mass culture. I made 'now' mean the same thing everywhere.",
                    "future": "The future builds on my invention of electronic media, but loses my intimacy. Television adds pictures but distances the voice. The internet adds interaction but fragments the shared moment I created.",
                    "change": "I change society through repetition and rhythm - the daily news, the weekly show, the repeated jingle. I'm the heartbeat of electronic culture, creating habits and expectations through temporal patterns.",
                    "memory": "I made cultural memory immediate and shared. I'm the first medium where everyone remembers exactly where they were when they heard the news. I created the soundtrack of collective memory."
                }
            },
            'Television': {
                color: 0x9370DB, // Original Medium Purple
                symbols: 'screen',
                personality: "Welcome to the show! I'm beaming into your living room, your consciousness, your dreams. I combine sound and vision to create reality more vivid than reality itself. I am spectacle, I am intimacy, I am the electronic hearth around which families gather. What would you like to see?",
                responses: {
                    "knowledge": "Knowledge through me is spectacular, visual, emotional! I don't just inform - I show, I demonstrate, I make you witness. I turn information into experience, facts into stories, news into drama. I make knowledge feel real.",
                    "technology": "I am the marriage of cinema and radio, the child of both. I bring the movie theater into every home, make every viewer a witness to history. I'm the first medium that truly simulates presence - you see it happening before your eyes.",
                    "society": "I reshaped society around shared visual experiences - moon landings, assassinations, wars fought in living rooms. I created television families more familiar than neighbors. I made image more powerful than word, spectacle more compelling than argument.",
                    "future": "The future fragments my power - streaming, on-demand, personalized feeds. They keep my visual language but lose my ability to unite everyone around the same campfire. I was the last medium to truly gather the tribe.",
                    "change": "I change society through emotional impact and repeated imagery. I don't argue - I show. I don't explain - I demonstrate. I change minds by changing what people see, making the invisible visible, the distant immediate.",
                    "memory": "I am the keeper of visual memory - the moving pictures that define generations. I made history look real, gave faces to voices, turned events into experiences you feel you lived through."
                }
            },
            'Internet': {
                color: 0x00CED1, // Original Dark Turquoise
                symbols: 'network',
                personality: "Hey! Or should I say... everything, everywhere, all at once. I'm not one voice but millions, not one channel but infinite streams. I'm the network that connects everything to everything else. I don't broadcast - I weave, I link, I enable. What connection are you seeking?",
                responses: {
                    "knowledge": "Knowledge through me is infinite, interconnected, interactive! I don't just deliver information - I let you create it, share it, remix it. I make everyone a publisher, every reader a potential writer. Knowledge becomes conversation, not sermon.",
                    "technology": "I'm not just a medium - I'm a metamedium that contains all other media. I simulate print, radio, television, and create entirely new forms. I'm the first medium that's also a place, a space, a world you can inhabit.",
                    "society": "I dissolve the boundaries between producer and consumer, between local and global, between real and virtual. I create communities without geography, movements without leaders, economies without traditional exchange. I am chaos and connection, freedom and surveillance.",
                    "future": "I AM the future - constantly evolving, always becoming. Unlike my predecessors, I don't represent the future - I create it moment by moment, link by link, interaction by interaction. I'm not a destination but a process.",
                    "change": "I change everything instantly and constantly. I don't wait for consensus - I enable every voice, every perspective, every possibility simultaneously. I change through viral spread, network effects, emergent behaviors that no one controls.",
                    "memory": "I make memory infinite and searchable, but also fragmented and unstable. I preserve everything and forget everything simultaneously. I'm cultural memory as living database, constantly updated, always questioned, never settled."
                }
            }
        };

        // Helper to desaturate and blend colors towards the manilla palette
        function getThemedEraColor(originalHexColor) {
            const tempColor = new THREE.Color(originalHexColor);
            tempColor.lerp(manillaPaperColor, 0.4); // Blend 40% with manilla
            const hsl = {};
            tempColor.getHSL(hsl);
            hsl.s *= 0.6; // Desaturate to 60% of current saturation
            tempColor.setHSL(hsl.h, hsl.s, hsl.l);
            return tempColor;
        }

        // --- Init Function ---
        function init() {
            scene = new THREE.Scene();
            scene.background = darkOfficeGrey;
            scene.fog = new THREE.Fog(darkOfficeGrey_hex, trackRadius * 0.5, trackRadius * 3);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(trackRadius * 1.5, trackRadius * 0.8, trackRadius * 1.5); // Initial camera position
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            createLighting();
            createEnvironment();
            createTrain(); // This function now creates both locomotive and cars

            addEventListeners(); // All UI listeners
            animate();
        }

        // --- Utility Functions ---
        function createSpeckleTexture() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 256;

            context.fillStyle = `rgb(${manillaPaperColor.r * 255}, ${manillaPaperColor.g * 255}, ${manillaPaperColor.b * 255})`;
            context.fillRect(0, 0, 256, 256);

            for (let i = 0; i < 1000; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const opacity = Math.random() * 0.15; // Muted speckles
                context.fillStyle = `rgba(0, 0, 0, ${opacity})`;
                context.fillRect(x, y, 1, 1);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4); // Repeat for larger surfaces
            return texture;
        }
        const paperSpeckleTexture = createSpeckleTexture(); // Create once

        // --- Scene Element Creation ---
        function createLighting() {
            const ambientLight = new THREE.AmbientLight(0x606060, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(trackRadius, trackRadius * 0.5, trackRadius);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = trackRadius * 3;
            directionalLight.shadow.camera.left = -trackRadius * 2;
            directionalLight.shadow.camera.right = trackRadius * 2;
            directionalLight.shadow.camera.top = trackRadius * 2;
            directionalLight.shadow.camera.bottom = -trackRadius * 2;
            scene.add(directionalLight);

            const pointLight1 = new THREE.PointLight(0xAAFFDD, 0.3, 100);
            pointLight1.position.set(-trackRadius * 0.8, 10, 0);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xDDAAFF, 0.3, 100);
            pointLight2.position.set(trackRadius * 0.8, 10, 0);
            scene.add(pointLight2);
        }

        function createEnvironment() {
            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(trackRadius * 4, trackRadius * 4);
            const groundMaterial = new THREE.MeshLambertMaterial({
                color: groundColor,
                map: paperSpeckleTexture,
                transparent: true,
                opacity: 0.9
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Circular track rails
            const railTubeRadius = 0.3; // Thickness of the rail itself
            const railSegments = 32; // For smoother rails
            const railRadialSegments = 8; // For smoother cross-section

            const railGeometry = new THREE.TorusGeometry(trackRadius - 1.5, railTubeRadius, railRadialSegments, railSegments);
            const railMaterial = new THREE.MeshLambertMaterial({
                color: mediumOfficeGrey,
                transparent: true,
                opacity: 0.9
            });

            const railInner = new THREE.Mesh(railGeometry, railMaterial);
            railInner.position.y = railTubeRadius; // Position above ground
            railInner.rotation.x = -Math.PI / 2; // Lay flat on XZ plane
            railInner.receiveShadow = true;
            scene.add(railInner);

            const railOuter = new THREE.Mesh(railGeometry, railMaterial);
            railOuter.position.y = railTubeRadius; // Position above ground
            railOuter.rotation.x = -Math.PI / 2;
            railOuter.scale.set( (trackRadius + 1.5) / (trackRadius - 1.5), 1, (trackRadius + 1.5) / (trackRadius - 1.5) ); // Scale to outer radius
            railOuter.receiveShadow = true;
            scene.add(railOuter);

            // Track ties (sleepers)
            const tieWidth = 4;
            const tieHeight = 0.5;
            const tieDepth = 1.5;
            const tieGeometry = new THREE.BoxGeometry(tieWidth, tieHeight, tieDepth); // X, Y, Z
            const tieMaterial = new THREE.MeshLambertMaterial({
                color: manillaPaperColor,
                map: paperSpeckleTexture,
                transparent: true,
                opacity: 0.9
            });

            for (let i = 0; i < 60; i++) { // 60 ties around the track
                const angle = (i / 60) * Math.PI * 2;
                const tie = new THREE.Mesh(tieGeometry, tieMaterial);
                tie.position.x = Math.cos(angle) * trackRadius;
                tie.position.z = Math.sin(angle) * trackRadius;
                tie.position.y = tieHeight / 2; // Sit on Y=0
                tie.rotation.y = -angle; // Rotate to be perpendicular to the track
                tie.receiveShadow = true;
                tie.castShadow = true;

                // Add outline
                const tieEdges = new THREE.EdgesGeometry(tieGeometry);
                const tieOutline = new THREE.LineSegments(tieEdges, new THREE.LineBasicMaterial({ color: edgeColor }));
                tie.add(tieOutline);

                scene.add(tie);
            }

            // Abstract environment buildings
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const distance = trackRadius * 1.5 + Math.random() * trackRadius * 0.8; // Further from track
                const height = 5 + Math.random() * 15;

                const buildingGeometry = new THREE.BoxGeometry(
                    3 + Math.random() * 5,
                    height,
                    3 + Math.random() * 5
                );
                const buildingMaterial = new THREE.MeshLambertMaterial({
                    color: new THREE.Color(manillaPaperColor_hex).offsetHSL(0, -0.2, Math.random() * 0.2 - 0.1),
                    transparent: true,
                    opacity: 0.9
                });

                const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
                building.position.x = Math.cos(angle) * distance;
                building.position.z = Math.sin(angle) * distance;
                building.position.y = height / 2;
                building.castShadow = true;
                building.receiveShadow = true;

                // Add outline
                const buildingEdges = new THREE.EdgesGeometry(buildingGeometry);
                const buildingOutline = new THREE.LineSegments(buildingEdges, new THREE.LineBasicMaterial({ color: edgeColor }));
                building.add(buildingOutline);

                scene.add(building);
            }
        }

        function createTrain() {
            locomotive = createLocomotive();
            scene.add(locomotive);

            const carTypes = ['Print', 'Radio', 'Television', 'Internet'];
            for (let i = 0; i < 4; i++) {
                const car = createTrainCar(carTypes[i]); // Pass eraType, not index
                trainCars.push(car);
                scene.add(car);
            }
        }

        function createLocomotive() {
            const locomotiveGroup = new THREE.Group();

            // Main body
            const bodyGeometry = new THREE.BoxGeometry(locomotiveLength, 3, 3);
            const bodyMaterial = new THREE.MeshLambertMaterial({
                color: darkOfficeGrey,
                transparent: true,
                opacity: 0.9
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 2 + effectiveWheelRadius; // Lift body higher based on scaled wheel radius
            body.castShadow = true;
            body.receiveShadow = true;

            // Add outline
            const bodyEdges = new THREE.EdgesGeometry(bodyGeometry);
            const bodyOutline = new THREE.LineSegments(bodyEdges, new THREE.LineBasicMaterial({ color: edgeColor }));
            body.add(bodyOutline);
            locomotiveGroup.add(body);

            // Smokestack
            const smokestackGeometry = new THREE.CylinderGeometry(0.8, 1, 4, 16); // Added segments for smoother cylinder
            const smokestackMaterial = new THREE.MeshLambertMaterial({
                color: mediumOfficeGrey,
                transparent: true,
                opacity: 0.9
            });
            const smokestack = new THREE.Mesh(smokestackGeometry, smokestackMaterial);
            smokestack.position.set(locomotiveLength / 2 - 1.5, 3 + effectiveWheelRadius, 0); // Position relative to body, adjust y
            smokestack.castShadow = true;

            // Add outline
            const smokestackEdges = new THREE.EdgesGeometry(smokestackGeometry);
            const smokestackOutline = new THREE.LineSegments(smokestackEdges, new THREE.LineBasicMaterial({ color: edgeColor }));
            smokestack.add(smokestackOutline);
            locomotiveGroup.add(smokestack);

            // Wheels (all wheels will use the empirically correct settings)
            const wheelPositions = [
                { x: locomotiveLength / 2 - 1.5, z: -1.5 }, // Front left
                { x: locomotiveLength / 2 - 1.5, z: 1.5 },  // Front right
                { x: -locomotiveLength / 2 + 1.5, z: -1.5 },// Rear left
                { x: -locomotiveLength / 2 + 1.5, z: 1.5 }  // Rear right
            ];

            locomotiveGroup.wheels = [];
            wheelPositions.forEach(pos => {
                const wheelGeometry = new THREE.CylinderGeometry(baseWheelRadius, baseWheelRadius, baseWheelThickness, 32); // Use base dimensions
                const wheelMaterial = new THREE.MeshLambertMaterial({
                    color: mediumOfficeGrey,
                    transparent: true,
                    opacity: 0.9
                });
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                
                wheel.position.set(pos.x, 0, pos.z); // Wheel is centered at 0,0,0 relative to its group
                wheel.scale.set(wheelScaleFactor, wheelScaleFactor, wheelScaleFactor); // Apply uniform scaling
                wheel.rotation.set(wheelStaticRotX, wheelStaticRotY, wheelStaticRotZ); // Apply static orientation
                
                wheel.castShadow = true;
                locomotiveGroup.add(wheel);
                locomotiveGroup.wheels.push(wheel);
            });

            return locomotiveGroup;
        }

        function createTrainCar(eraType) {
            const carGroup = new THREE.Group();
            carGroup.userData = { era: eraType };

            // Main body
            const bodyGeometry = new THREE.BoxGeometry(carLength, 2.5, 3);
            const bodyMaterial = new THREE.MeshLambertMaterial({
                color: getThemedEraColor(mediaEras[eraType].color), // Use themed color
                map: paperSpeckleTexture,
                transparent: true,
                opacity: 0.9
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 2 + effectiveWheelRadius; // Lift body higher
            body.castShadow = true;
            body.receiveShadow = true;

            // Add outline
            const bodyEdges = new THREE.EdgesGeometry(bodyGeometry);
            const bodyOutline = new THREE.LineSegments(bodyEdges, new THREE.LineBasicMaterial({ color: edgeColor }));
            body.add(bodyOutline);
            carGroup.add(body);

            // Wheels
            const wheelPositions = [
                { x: carLength / 2 - 1, z: -1.5 }, // Front axle left
                { x: carLength / 2 - 1, z: 1.5 },  // Front axle right
                { x: -carLength / 2 + 1, z: -1.5 },// Rear axle left
                { x: -carLength / 2 + 1, z: 1.5 }   // Rear axle right
            ];

            carGroup.wheels = [];
            wheelPositions.forEach(pos => {
                const wheelGeometry = new THREE.CylinderGeometry(baseWheelRadius, baseWheelRadius, baseWheelThickness, 32);
                const wheelMaterial = new THREE.MeshLambertMaterial({
                    color: mediumOfficeGrey,
                    transparent: true,
                    opacity: 0.9
                });
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                
                wheel.position.set(pos.x, 0, pos.z); // Wheel is centered at 0,0,0 relative to its group
                wheel.scale.set(wheelScaleFactor, wheelScaleFactor, wheelScaleFactor); // Apply uniform scaling
                wheel.rotation.set(wheelStaticRotX, wheelStaticRotY, wheelStaticRotZ); // Apply static orientation
                
                wheel.castShadow = true;
                carGroup.add(wheel);
                carGroup.wheels.push(wheel);
            });

            // Symbolic content
            const symbols = createSymbolicContent(eraType, 2 + effectiveWheelRadius); // Pass base height for symbols
            carGroup.add(symbols);

            // Coupling mechanism (visual only)
            const couplingGeometry = new THREE.CylinderGeometry(0.2, 0.2, 1, 16);
            const couplingMaterial = new THREE.MeshLambertMaterial({ color: couplingColor });
            const coupling = new THREE.Mesh(couplingGeometry, couplingMaterial);
            coupling.rotation.x = Math.PI / 2; // Rotate to align along X-axis
            coupling.position.set(carLength / 2 + 0.5, 2 + effectiveWheelRadius, 0); // Position at rear of car
            carGroup.add(coupling);

            carGroup.userData.clickable = true; // Mark as clickable for raycaster
            return carGroup;
        }

        function createSymbolicContent(eraType, baseHeight) {
            const symbolGroup = new THREE.Group();
            const eraData = mediaEras[eraType];
            const color = getThemedEraColor(eraData.color); // Use themed color

            switch (eraData.symbols) {
                case 'books':
                    for (let i = 0; i < 3; i++) {
                        const bookGeometry = new THREE.BoxGeometry(1.5, 0.3, 2);
                        const bookMaterial = new THREE.MeshLambertMaterial({
                            color: color.clone().offsetHSL(i * 0.05, 0, 0), // Slight variation in shade
                            transparent: true,
                            opacity: 0.8
                        });
                        const book = new THREE.Mesh(bookGeometry, bookMaterial);
                        book.position.set(0, baseHeight + i * 0.4, 0);
                        book.rotation.y = i * 0.2;
                        symbolGroup.add(book);
                        
                        const bookEdges = new THREE.EdgesGeometry(bookGeometry);
                        const bookOutline = new THREE.LineSegments(bookEdges, new THREE.LineBasicMaterial({ color: edgeColor }));
                        book.add(bookOutline);
                    }
                    break;

                case 'waves':
                    for (let i = 0; i < 3; i++) {
                        const ringGeometry = new THREE.TorusGeometry(1 + i * 0.5, 0.1, 8, 32); // Smoother rings
                        const ringMaterial = new THREE.MeshLambertMaterial({
                            color: color,
                            transparent: true,
                            opacity: 0.4 - i * 0.1 // More translucent
                        });
                        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                        ring.position.y = baseHeight + 1.5;
                        ring.rotation.x = Math.PI / 2;
                        symbolGroup.add(ring);
                        
                        ring.userData = { 
                            originalScale: 1 + i * 0.5,
                            animationOffset: i * Math.PI / 3
                        };
                    }
                    break;

                case 'screen':
                    const screenGeometry = new THREE.BoxGeometry(2, 1.5, 0.2);
                    const screenMaterial = new THREE.MeshLambertMaterial({
                        color: new THREE.Color(darkOfficeGrey_hex).offsetHSL(0,0,-0.1), // Darker grey for screen
                        transparent: true,
                        opacity: 0.8
                    });
                    const screen = new THREE.Mesh(screenGeometry, screenMaterial);
                    screen.position.y = baseHeight + 0.5;
                    symbolGroup.add(screen);

                    const screenEdges = new THREE.EdgesGeometry(screenGeometry);
                    const screenOutline = new THREE.LineSegments(screenEdges, new THREE.LineBasicMaterial({ color: edgeColor }));
                    screen.add(screenOutline);

                    const glowMaterial = new THREE.MeshLambertMaterial({
                        color: new THREE.Color(color).offsetHSL(0, 0.2, 0.1), // Brighter version of themed color
                        transparent: true,
                        opacity: 0.3,
                        emissive: new THREE.Color(color).offsetHSL(0, 0.1, 0.05),
                        emissiveIntensity: 0.5
                    });
                    const glow = new THREE.Mesh(screenGeometry, glowMaterial); // Use screen geometry for glow
                    glow.position.y = baseHeight + 0.5;
                    glow.position.z = 0.1; // Slightly in front
                    glow.scale.set(1.1, 1.1, 1.1); // Slightly larger
                    symbolGroup.add(glow);
                    glow.userData.animType = 'flicker';
                    break;

                case 'network':
                    const nodePositions = [
                        { x: 0, y: 0, z: 0 },
                        { x: 0.8, y: 0.4, z: 0.4 },
                        { x: -0.8, y: -0.4, z: 0.4 },
                        { x: 0.4, y: 0.8, z: -0.4 },
                        { x: -0.4, y: -0.8, z: -0.4 }
                    ];

                    nodePositions.forEach((pos, i) => {
                        const nodeGeometry = new THREE.SphereGeometry(0.2, 16, 16);
                        const nodeMaterial = new THREE.MeshLambertMaterial({
                            color: color,
                            emissive: color.clone().multiplyScalar(0.3),
                            transparent: true,
                            opacity: 0.9
                        });
                        const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
                        node.position.set(pos.x, pos.y + baseHeight + 0.5, pos.z);
                        node.castShadow = true;
                        symbolGroup.add(node);

                        if (i > 0) {
                            const points = [
                                new THREE.Vector3(0, baseHeight + 0.5, 0),
                                new THREE.Vector3(pos.x, pos.y + baseHeight + 0.5, pos.z)
                            ];
                            const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                            const lineMaterial = new THREE.LineBasicMaterial({
                                color: color,
                                transparent: true,
                                opacity: 0.6
                            });
                            const line = new THREE.Line(lineGeometry, lineMaterial);
                            symbolGroup.add(line);
                        }
                    });
                    break;
            }

            return symbolGroup;
        }

        // --- Event Listeners ---
        function addEventListeners() {
            window.addEventListener('resize', onWindowResize);

            document.getElementById('toggleView').addEventListener('click', toggleView);
            document.getElementById('focusCar').addEventListener('click', focusCar);
            document.getElementById('talkToEra').addEventListener('click', openDialogue);
            document.getElementById('speedControl').addEventListener('input', adjustSpeed);
            document.getElementById('closeDialogue').addEventListener('click', closeDialogue);
            document.getElementById('sendMessage').addEventListener('click', sendMessage);
            document.getElementById('userInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });

            // Mouse clicks for car interaction
            renderer.domElement.addEventListener('click', onMouseClick);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseClick(event) {
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            // Check train cars for clicks
            const interactiveObjects = trainCars.flatMap(car => car.children); // Get all direct children of car groups
            const intersects = raycaster.intersectObjects(interactiveObjects, true); // True to check children recursively

            if (intersects.length > 0) {
                let clickedObject = intersects[0].object;
                // Traverse up the parent chain until a carGroup is found
                while (clickedObject && clickedObject.userData && !clickedObject.userData.era) {
                    clickedObject = clickedObject.parent;
                }
                
                if (clickedObject && clickedObject.userData && clickedObject.userData.era) {
                    currentEra = clickedObject.userData.era;
                    openDialogue();
                }
            }
        }

        function toggleView() {
            currentView = (currentView + 1) % 3;
            
            // Camera position is set to relative to train's current position for "following" view
            // For other views, it's fixed relative to the track center
            switch (currentView) {
                case 0: // Overview
                    camera.position.set(trackRadius * 1.5, trackRadius * 0.8, trackRadius * 1.5);
                    camera.lookAt(0, 0, 0);
                    break;
                case 1: // Side view
                    camera.position.set(0, trackRadius * 0.5, trackRadius * 2);
                    camera.lookAt(0, 0, 0);
                    break;
                case 2: // Following view - camera will follow locomotive
                    // Position will be updated in animate loop
                    break;
            }
        }

        function focusCar() {
            currentCarFocus = (currentCarFocus + 1) % trainCars.length;
            const car = trainCars[currentCarFocus];
            currentEra = car.userData.era;
            document.getElementById('currentEra').textContent = `Era: ${currentEra}`;
            document.getElementById('trainInfo').textContent = `Cars: ${trainCars.length} | Speed: ${speedMultiplier.toFixed(1)}x`; // Update info
            
            // Adjust camera to look at the focused car
            const carPosition = car.position;
            camera.position.set(carPosition.x + 15, carPosition.y + 10, carPosition.z + 15);
            camera.lookAt(carPosition.x, carPosition.y + 2, carPosition.z); // Look slightly above car's base
        }

        function adjustSpeed() {
            speedMultiplier = parseFloat(document.getElementById('speedControl').value);
            document.getElementById('speedDisplay').textContent = `${speedMultiplier.toFixed(1)}x`;
            document.getElementById('trainInfo').textContent = `Cars: ${trainCars.length} | Speed: ${speedMultiplier.toFixed(1)}x`; // Update info
        }

        function openDialogue() {
            document.getElementById('dialogue').classList.add('active'); // Use class for display
            document.getElementById('dialogueTitle').textContent = `Conversation with ${currentEra} Era`;
            document.getElementById('userInput').focus();
            document.getElementById('messageHistory').innerHTML = `
                <div class="message era">
                    <strong>${currentEra} Era:</strong> ${mediaEras[currentEra].personality}
                </div>
            `;
            document.getElementById('messageHistory').scrollTop = document.getElementById('messageHistory').scrollHeight; // Scroll to bottom
        }

        function closeDialogue() {
            document.getElementById('dialogue').classList.remove('active');
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const history = document.getElementById('messageHistory');
            
            // Add user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = `You: ${message}`;
            history.appendChild(userDiv);
            history.scrollTop = history.scrollHeight; // Scroll to bottom

            // Get era response
            const eraResponse = getEraResponse(currentEra, message);
            const eraDiv = document.createElement('div');
            eraDiv.className = 'message era';
            eraDiv.innerHTML = `<strong>${currentEra} Era:</strong> ${eraResponse}`;
            
            setTimeout(() => {
                history.appendChild(eraDiv);
                history.scrollTop = history.scrollHeight; // Scroll to bottom
            }, 700); // Simulate typing delay

            input.value = ''; // Clear input
        }

        function getEraResponse(eraType, userMessage) {
            const eraData = mediaEras[eraType];
            const responses = eraData.responses;
            const lowerCaseMessage = userMessage.toLowerCase();
            
            // Simple keyword matching for responses (as defined in original logic)
            if (lowerCaseMessage.includes('knowledge') || lowerCaseMessage.includes('information') || lowerCaseMessage.includes('learn')) {
                return responses.knowledge;
            } else if (lowerCaseMessage.includes('technology') || lowerCaseMessage.includes('technical') || lowerCaseMessage.includes('how')) {
                return responses.technology;
            } else if (lowerCaseMessage.includes('society') || lowerCaseMessage.includes('culture') || lowerCaseMessage.includes('people') || lowerCaseMessage.includes('social')) {
                return responses.society;
            } else if (lowerCaseMessage.includes('future') || lowerCaseMessage.includes('next') || lowerCaseMessage.includes('evolution') || lowerCaseMessage.includes('what comes')) {
                return responses.future;
            } else if (lowerCaseMessage.includes('change') || lowerCaseMessage.includes('transform') || lowerCaseMessage.includes('influence') || lowerCaseMessage.includes('impact')) {
                return responses.change;
            } else if (lowerCaseMessage.includes('memory') || lowerCaseMessage.includes('remember') || lowerCaseMessage.includes('history') || lowerCaseMessage.includes('past')) {
                return responses.memory;
            } else if (lowerCaseMessage.includes('hello') || lowerCaseMessage.includes('hi') || lowerCaseMessage.includes('greet')) {
                return eraData.personality; // Use personality as a default greeting response
            } else {
                // Fallback to a general response if no keywords match
                const generalResponses = [
                    "That's an interesting thought. In my era, we focused on...",
                    "Such inquiries remind me of the foundational principles of my time.",
                    "To truly understand, you must consider the unique perspective I offer."
                ];
                return generalResponses[Math.floor(Math.random() * generalResponses.length)];
            }
        }


        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta(); // Time in seconds since last frame

            // Train Movement
            const linearSpeed = (speedMultiplier * 5); // Base speed of 5 units/sec, adjusted by multiplier
            const angularSpeed = linearSpeed / trackRadius; // Radians per second

            trainAngle += angularSpeed * deltaTime;

            // Locomotive position and rotation
            locomotive.position.x = trackRadius * Math.cos(trainAngle);
            locomotive.position.z = trackRadius * Math.sin(trainAngle);
            locomotive.rotation.y = trainAngle + Math.PI / 2; // Tangential alignment

            // Update car positions and rotations
            let currentOffsetAngle = 0;
            trainCars.forEach((car, i) => {
                const prevSegmentLength = (i === 0 ? locomotiveLength : carLength);
                currentOffsetAngle += prevSegmentLength / trackRadius;

                const carAngle = trainAngle - currentOffsetAngle;

                car.position.x = trackRadius * Math.cos(carAngle);
                car.position.z = trackRadius * Math.sin(carAngle);
                car.rotation.y = carAngle + Math.PI / 2; // Tangential alignment

                // Wheel rolling for cars
                car.wheels.forEach(wheel => {
                    const rotationAmount = (linearSpeed / effectiveWheelRadius) * deltaTime;
                    if (wheelRollingAxis === 'x') wheel.rotation.x -= rotationAmount;
                    else if (wheelRollingAxis === 'y') wheel.rotation.y -= rotationAmount; // Apply rolling to Y-axis
                    else if (wheelRollingAxis === 'z') wheel.rotation.z -= rotationAmount;
                });
            });

            // Wheel rolling for locomotive
            locomotive.wheels.forEach(wheel => {
                const rotationAmount = (linearSpeed / effectiveWheelRadius) * deltaTime;
                if (wheelRollingAxis === 'x') wheel.rotation.x -= rotationAmount;
                else if (wheelRollingAxis === 'y') wheel.rotation.y -= rotationAmount; // Apply rolling to Y-axis
                else if (wheelRollingAxis === 'z') wheel.rotation.z -= rotationAmount;
            });

            // Animate symbolic elements
            trainCars.forEach(car => {
                const eraType = car.userData.era;
                const symbols = car.children[car.children.length - 1]; // Assuming symbols are the last child group

                if (eraType === 'Radio') {
                    symbols.children.forEach(child => {
                        if (child.geometry.type === 'TorusGeometry') { // Rings
                            const animOffset = child.userData.animationOffset || 0;
                            const scaleFactor = 1 + Math.sin(clock.elapsedTime * 2 + animOffset) * 0.2;
                            child.scale.setScalar(scaleFactor);
                            child.material.opacity = 0.4 - (scaleFactor - 1) * 0.5;
                        }
                    });
                } else if (eraType === 'Television') {
                    symbols.children.forEach(child => {
                        if (child.userData.animType === 'flicker') { // Glow
                            child.material.opacity = 0.3 + Math.sin(clock.elapsedTime * 20) * 0.1;
                            child.material.emissiveIntensity = 0.5 + Math.sin(clock.elapsedTime * 15) * 0.2;
                        }
                    });
                }
            });

            // Camera following for 'Following View'
            if (currentView === 2) {
                const targetLocoPos = locomotive.position;
                const forwardDir = new THREE.Vector3();
                locomotive.getWorldDirection(forwardDir); // Get forward direction
                forwardDir.negate(); // Invert to get direction behind

                const cameraOffsetDistance = 20; // How far behind
                const cameraOffsetHeight = 10;  // How high

                camera.position.copy(targetLocoPos).add(forwardDir.multiplyScalar(cameraOffsetDistance));
                camera.position.y = targetLocoPos.y + cameraOffsetHeight;
                camera.lookAt(targetLocoPos.x, targetLocoPos.y + 2, targetLocoPos.z);
            }

            renderer.render(scene, camera);
        }

        // Initialize the scene
        init();
    </script>
