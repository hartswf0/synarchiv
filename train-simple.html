<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Train Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a1a; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px;
            font-family: monospace;
        }
        #debug { 
            position: absolute; bottom: 10px; left: 10px;
            color: white; font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Train Speed: <input type="range" id="speed" min="-10" max="10" step="0.1" value="0">
        <span id="speedValue">0.0</span></div>
        <button id="addCar">Add Car</button>
        <button id="reset">Reset</button>
    </div>
    <div id="debug">Position: 0.00 | Speed: 0.00</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // Basic setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Track parameters
        const trackRadius = 15;
        const trackWidth = 2;
        
        // Create circular track
        function createTrack() {
            const trackGeometry = new THREE.TorusGeometry(trackRadius, 0.5, 8, 64);
            const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const track = new THREE.Mesh(trackGeometry, trackMaterial);
            track.rotation.x = -Math.PI / 2;
            track.position.y = 0.1;
            track.receiveShadow = true;
            scene.add(track);
            
            // Add sleepers
            const sleeperGeometry = new THREE.BoxGeometry(2, 0.1, 0.5);
            const sleeperMaterial = new THREE.MeshStandardMaterial({ color: 0x5D4037 });
            
            for (let i = 0; i < 60; i++) {
                const angle = (i / 60) * Math.PI * 2;
                const sleeper = new THREE.Mesh(sleeperGeometry, sleeperMaterial);
                sleeper.position.set(
                    Math.cos(angle) * trackRadius,
                    0.05,
                    Math.sin(angle) * trackRadius
                );
                sleeper.rotation.y = -angle;
                sleeper.castShadow = true;
                sleeper.receiveShadow = true;
                scene.add(sleeper);
            }
            
            return track;
        }

        // Create a simple train car
        function createCar(color = 0x4CAF50, isLocomotive = false) {
            const group = new THREE.Group();
            
            // Car body
            const bodyLength = isLocomotive ? 3 : 2;
            const bodyGeometry = new THREE.BoxGeometry(bodyLength, 1, 1.5);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.75;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            
            // Wheels
            const wheelPositions = [
                { x: -bodyLength/2 + 0.3, z: 0.6 },
                { x: bodyLength/2 - 0.3, z: 0.6 },
                { x: -bodyLength/2 + 0.3, z: -0.6 },
                { x: bodyLength/2 - 0.3, z: -0.6 }
            ];
            
            const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.position.set(pos.x, 0.3, pos.z);
                wheel.rotation.z = Math.PI / 2;
                wheel.castShadow = true;
                group.add(wheel);
                
                // Store wheel reference for animation
                if (!group.wheels) group.wheels = [];
                group.wheels.push(wheel);
            });
            
            // Position the car on the track
            group.position.y = 0.7;
            group.userData = { isLocomotive, speed: 0, targetSpeed: 0 };
            
            return group;
        }

        // Initialize scene
        const track = createTrack();
        const trainCars = [];
        
        // Add initial locomotive
        const loco = createCar(0x4CAF50, true);
        trainCars.push(loco);
        scene.add(loco);
        
        // Position camera
        camera.position.set(0, 15, 20);
        camera.lookAt(0, 0, 0);
        
        // Animation
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(0.05, clock.getDelta());
            
            // Update train movement
            trainCars.forEach((car, index) => {
                // Only the first car (locomotive) controls the speed
                if (index === 0) {
                    const targetSpeed = car.userData.targetSpeed * 0.5;
                    car.userData.speed += (targetSpeed - car.userData.speed) * 0.1;
                }
                
                // Update position along track
                if (index === 0) {
                    // Move locomotive
                    car.rotation.y += car.userData.speed * delta;
                } else {
                    // Follow previous car
                    const prevCar = trainCars[index - 1];
                    const targetAngle = Math.atan2(
                        prevCar.position.x - Math.sin(prevCar.rotation.y) * 2.5,
                        prevCar.position.z - Math.cos(prevCar.rotation.y) * 2.5
                    );
                    car.rotation.y = targetAngle;
                    car.position.x = prevCar.position.x - Math.sin(targetAngle) * 2.5;
                    car.position.z = prevCar.position.z - Math.cos(targetAngle) * 2.5;
                }
                
                // Rotate wheels
                if (car.wheels) {
                    const rotation = car.userData.speed * 2 * delta;
                    car.wheels.forEach(wheel => {
                        wheel.rotation.x += rotation;
                    });
                }
                
                // Update debug info for first car
                if (index === 0) {
                    document.getElementById('debug').textContent = 
                        `Position: ${car.rotation.y.toFixed(2)} | Speed: ${car.userData.speed.toFixed(2)}`;
                }
            });
            
            renderer.render(scene, camera);
        }
        
        // UI Controls
        const speedInput = document.getElementById('speed');
        const speedValue = document.getElementById('speedValue');
        
        speedInput.addEventListener('input', (e) => {
            const speed = parseFloat(e.target.value);
            speedValue.textContent = speed.toFixed(1);
            trainCars[0].userData.targetSpeed = speed * 0.01;
        });
        
        document.getElementById('addCar').addEventListener('click', () => {
            if (trainCars.length < 5) { // Limit to 5 cars
                const car = createCar(0x2196F3);
                const lastCar = trainCars[trainCars.length - 1];
                car.position.copy(lastCar.position);
                car.rotation.y = lastCar.rotation.y;
                trainCars.push(car);
                scene.add(car);
            }
        });
        
        document.getElementById('reset').addEventListener('click', () => {
            // Reset train cars
            trainCars.forEach((car, index) => {
                if (index > 0) {
                    scene.remove(car);
                }
            });
            
            // Keep only the locomotive
            while (trainCars.length > 1) trainCars.pop();
            
            // Reset locomotive
            const loco = trainCars[0];
            loco.position.set(0, 0.7, 0);
            loco.rotation.set(0, 0, 0);
            loco.userData.speed = 0;
            loco.userData.targetSpeed = 0;
            
            // Reset UI
            speedInput.value = 0;
            speedValue.textContent = '0.0';
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Start animation
        animate();
    </script>
</body>
</html>
