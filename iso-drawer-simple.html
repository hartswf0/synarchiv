<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Isometric Drawer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #ecf0f1;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            z-index: 100;
            pointer-events: none;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <div id="info">Click to open/close drawer</div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 10);
        camera.lookAt(0, 0, 0);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // Materials
        const drawerMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x3a3a4a,
            flatShading: true
        });
        
        const folderMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x4a69bd,
            flatShading: true
        });
        
        // Drawer
        const drawerGroup = new THREE.Group();
        scene.add(drawerGroup);
        
        // Drawer body
        const drawerBody = new THREE.Mesh(
            new THREE.BoxGeometry(6, 4, 8),
            drawerMaterial
        );
        drawerBody.position.y = 2;
        drawerBody.castShadow = true;
        drawerBody.receiveShadow = true;
        drawerGroup.add(drawerBody);
        
        // Drawer face (front)
        const drawerFace = new THREE.Mesh(
            new THREE.BoxGeometry(6.1, 4.1, 0.2),
            new THREE.MeshPhongMaterial({ 
                color: 0x2a2a3a,
                flatShading: true
            })
        );
        drawerFace.position.set(0, 2, 4);
        drawerGroup.add(drawerFace);
        
        // Folders
        const folders = [];
        const folderCount = 4;
        const folderWidth = 1.2;
        const folderHeight = 2.5;
        const folderDepth = 0.1;
        
        for (let i = 0; i < folderCount; i++) {
            const folder = new THREE.Mesh(
                new THREE.BoxGeometry(folderWidth, folderHeight, folderDepth),
                folderMaterial
            );
            
            // Position folders in a line
            const spacing = 1.5;
            const startX = -((folderCount - 1) * spacing) / 2;
            folder.position.set(startX + i * spacing, 2, 0);
            folder.rotation.x = Math.PI / 10; // Slight tilt
            
            folder.castShadow = true;
            folder.receiveShadow = true;
            
            drawerGroup.add(folder);
            folders.push(folder);
        }
        
        // Animation
        let isDrawerOpen = false;
        const closedZ = 0;
        const openZ = -6;
        
        // Click handler
        window.addEventListener('click', () => {
            isDrawerOpen = !isDrawerOpen;
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Smooth drawer animation
            drawerGroup.position.z += (isDrawerOpen ? openZ : closedZ - drawerGroup.position.z) * 0.1;
            
            // Rotate camera around scene
            const time = Date.now() * 0.0005;
            camera.position.x = Math.sin(time) * 10;
            camera.position.z = Math.cos(time) * 10;
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
