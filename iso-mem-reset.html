                document.getElementById('open-drawer').textContent =
                    this.openDrawer ? `#${this.openDrawer.userData.index}` : 'None';

                const visibleArtifacts = this.artifacts.filter(a => a.visible).length;
                const visibleFiles = this.fileFolders.filter(f => f.visible).length;
                let visibleDocs = 0;
                if (this.activeFileFolder) {
                    visibleDocs = this.activeFileFolder.userData.documents.filter(d => d.visible).length;
                }

                document.getElementById('visible-artifacts').textContent =
                    `${visibleArtifacts}A, ${visibleFiles}F, ${visibleDocs}D`;


                document.getElementById('timeline-debug').textContent =
                    Math.round(this.timelineValue * 100) + '%';

                document.getElementById('camera-rot').textContent =
                    Math.round((this.currentRotation * 180 / Math.PI) % 360) + '°';

                document.getElementById('mouse-pos').textContent =
                    `${this.pointer.x.toFixed(2)}, ${this.pointer.y.toFixed(2)}`;
            }

            rotateView() {
                this.currentRotation += Math.PI / 2;
                const radius = 14.14;
                const x = Math.cos(this.currentRotation) * radius;
                const z = Math.sin(this.currentRotation) * radius;

                this.animateCamera({ x: x, y: 10, z: z }, 1000, 10)
                    .catch(e => console.error("Error rotating view:", e));
            }

            animateCamera(targetPosition, duration, targetFrustumSize = this.camera.top * 2) {
                const startPosition = this.camera.position.clone();
                const startFrustumSize = this.camera.top * 2;
                const startTime = Date.now();
                this.isGlobalAnimating = true; // Block input during this animation
                document.getElementById('container').classList.add('animating-global');

                return new Promise(resolve => {
                    const animate = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const eased = this.easeOutCubic(progress);

                        this.camera.position.lerpVectors(startPosition, new THREE.Vector3(targetPosition.x, targetPosition.y, targetPosition.z), eased);

                        const currentFrustumSize = startFrustumSize + (targetFrustumSize - startFrustumSize) * eased;
                        const aspect = window.innerWidth / window.innerHeight;
                        this.camera.left = currentFrustumSize * aspect / -2;
                        this.camera.right = currentFrustumSize * aspect / 2;
                        this.camera.top = currentFrustumSize / 2;
                        this.camera.bottom = currentFrustumSize / -2;
                        this.camera.updateProjectionMatrix();

                        let lookAtTarget = new THREE.Vector3(0, 2, 0); // Default focus
                        if (this.activeFileFolder) {
                            lookAtTarget = this.activeFileFolder.position.clone();
                            lookAtTarget.y += 0.8; // Look at file folder
                        } else if (this.openDrawer) {
                            lookAtTarget = this.openDrawer.position.clone();
                            lookAtTarget.y += 0.5;
                            lookAtTarget.z += 1.5; // Look at center of open drawer area
                        }
                        this.camera.lookAt(lookAtTarget);

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            this.camera.position.copy(targetPosition);
                            this.camera.left = targetFrustumSize * aspect / -2;
                            this.camera.right = targetFrustumSize * aspect / 2;
                            this.camera.top = targetFrustumSize / 2;
                            this.camera.bottom = targetFrustumSize / -2;
                            this.camera.updateProjectionMatrix();
                            this.isGlobalAnimating = false; // Re-enable input
                            document.getElementById('container').classList.remove('animating-global');
                            resolve();
                        }
                    };
                    animate();
                });
            }

            showInfo(data) {
                const panel = document.getElementById('info-panel');
                const title = document.getElementById('info-title');
                const description = document.getElementById('info-description');

                title.textContent = data.title;
                description.textContent = data.desc;
                panel.classList.add('visible');
            }

            hideInfo() {
                const panel = document.getElementById('info-panel');
                panel.classList.remove('visible');
            }

            show2DDrawer(drawer) {
                this.is2DDrawerOpen = true;
                document.getElementById('container').classList.add('modal-open');
                document.body.style.cursor = 'default';
                this.hideInfo();

                const modal = document.getElementById('drawer-2d-modal');
                const titleEl = document.getElementById('drawer-2d-title');
                const descEl = document.getElementById('drawer-2d-description');
                const artifactsContainer = document.getElementById('drawer-2d-artifacts');

                titleEl.textContent = `Artifacts in: ${drawer.userData.data.title}`;
                descEl.textContent = `These are abstract data fragments retrieved from the drawer.`;
                artifactsContainer.innerHTML = '';

                drawer.userData.artifacts.forEach(artifact => {
                    const artifactData = artifact.userData.artifactData2D;
                    const itemDiv = document.createElement('div');
                    itemDiv.classList.add('artifact-2d-item');
                    itemDiv.innerHTML = `
                        <div class="icon">${artifactData.icon}</div>
                        <div class="name">${artifactData.name}</div>
                        <div class="description">${artifactData.description}</div>
                    `;
                    artifactsContainer.appendChild(itemDiv);
                });
                modal.classList.add('visible');
            }

            hide2DDrawer() {
                if (!this.is2DDrawerOpen) return Promise.resolve();

                this.is2DDrawerOpen = false;
                document.getElementById('container').classList.remove('modal-open');
                document.getElementById('drawer-2d-modal').classList.remove('visible');

                // When 2D modal closes, artifacts fade back in and resume floating
                if (this.openDrawer) {
                    const artifactFadeInPromises = this.openDrawer.userData.artifacts.map(artifact => {
                        artifact.visible = true; // Ensure they are visible to animate
                        return this.animateObjectTransition(artifact, 300, 'in');
                    });
                    const fileFolderFadeInPromises = this.openDrawer.userData.files.map(fileFolder => {
                        fileFolder.visible = true; // Ensure they are visible to animate
                        return this.animateObjectTransition(fileFolder, 300, 'in');
                    });
                    return Promise.all([...artifactFadeInPromises, ...fileFolderFadeInPromises]);
                }
                return Promise.resolve();
            }

            // The main animation loop
            animate() {
                requestAnimationFrame(() => this.animate());

                const deltaTime = this.clock.getDelta(); // Time since last frame
                const time = this.clock.getElapsedTime(); // Total elapsed time

                // Animate floating artifacts
                this.artifacts.forEach((artifact) => {
                    const mainMesh = artifact.userData.mainMesh;
                    if (!mainMesh || !mainMesh.material) return;

                    if (artifact.visible) {
                        const offset = artifact.userData.floatOffset;

                        if (artifact.userData.isEmerging) {
                            artifact.userData.emergenceProgress += deltaTime * 1.5;
                            const progress = Math.min(artifact.userData.emergenceProgress, 1);
                            const eased = this.easeOutCubic(progress);

                            artifact.position.lerpVectors(
                                artifact.userData.startPosition,
                                artifact.userData.targetPosition,
                                eased
                            );
                            const targetScale = artifact.userData.originalScale;
                            artifact.scale.setScalar(targetScale * eased);
                            mainMesh.material.opacity = 0.05 + (targetScale * 0.85 - 0.05) * eased;

                            artifact.rotation.x = Math.sin(time * 5 + offset) * 0.2 * (1 - eased);
                            artifact.rotation.y += deltaTime * 0.8 * (1 - eased); // Slower initial spin, then static
                            artifact.rotation.z = Math.cos(time * 4 + offset) * 0.2 * (1 - eased);

                            if (progress >= 1) {
                                artifact.userData.isEmerging = false;
                                artifact.position.copy(artifact.userData.targetPosition);
                                artifact.scale.setScalar(targetScale);
                                mainMesh.material.opacity = targetScale * 0.85;
                                if (artifact.userData.onAnimationComplete) { // Call promise resolver
                                    artifact.userData.onAnimationComplete();
                                    artifact.userData.onAnimationComplete = null;
                                }
                            }
                        } else if (!this.is2DDrawerOpen && !this.isFileOpen) { // Normal floating animation only if no modal/file open
                            artifact.rotation.y += deltaTime * 0.5;
                            artifact.position.y = artifact.userData.targetPosition.y + Math.sin(time * 2 + offset) * 0.05;
                        } else {
                            // If a modal/file is open, artifacts should remain still at their last position
                            // No floating, no rotation
                        }
                    }
                });

                // Animate floating file folders
                this.fileFolders.forEach((fileFolder) => {
                    const mainMesh = fileFolder.userData.mainMesh;
                    if (!mainMesh || !mainMesh.material) return;

                    if (fileFolder.visible) {
                        const offset = fileFolder.uuid.charCodeAt(0) * 0.1;
                        if (fileFolder.userData.isEmerging) {
                            fileFolder.userData.emergenceProgress += deltaTime * 1.5;
                            const progress = Math.min(fileFolder.userData.emergenceProgress, 1);
                            const eased = this.easeOutCubic(progress);

                            fileFolder.position.lerpVectors(
                                fileFolder.userData.originalPosition,
                                fileFolder.userData.targetPosition,
                                eased
                            );
                            const targetScale = fileFolder.userData.originalScale;
                            fileFolder.scale.setScalar(targetScale * eased);
                            mainMesh.material.opacity = 0.05 + (targetScale * 0.9 - 0.05) * eased;

                            if (progress >= 1) {
                                fileFolder.userData.isEmerging = false;
                                fileFolder.position.copy(fileFolder.userData.targetPosition);
                                fileFolder.scale.setScalar(targetScale);
                                mainMesh.material.opacity = targetScale * 0.9;
                                if (fileFolder.userData.onAnimationComplete) { // Call promise resolver
                                    fileFolder.userData.onAnimationComplete();
                                    fileFolder.userData.onAnimationComplete = null;
                                }
                            }
                        } else if (!this.is2DDrawerOpen && !this.isFileOpen) {
                            fileFolder.rotation.y += deltaTime * 0.3;
                            fileFolder.position.y = fileFolder.userData.targetPosition.y + Math.sin(time * 1.5 + offset) * 0.03;
                        } else {
                            // If a modal/file is open, files should remain still
                        }
                    }
                });

                // Animate emerging documents within an open file folder
                if (this.isFileOpen && this.activeFileFolder) {
                    this.activeFileFolder.userData.documents.forEach((documentMesh) => {
                        const mainMesh = documentMesh.userData.mainMesh;
                        if (!mainMesh || !mainMesh.material) return;

                        if (documentMesh.visible) {
                            if (documentMesh.userData.isEmerging) {
                                documentMesh.userData.emergenceProgress += deltaTime * 2.0;
                                const progress = Math.min(documentMesh.userData.emergenceProgress, 1);
                                const eased = this.easeOutCubic(progress);

                                documentMesh.position.lerpVectors(
                                    documentMesh.userData.startPosition,
                                    documentMesh.userData.targetPosition,
                                    eased
                                );
                                documentMesh.scale.setScalar(documentMesh.userData.originalScale * eased);
                                mainMesh.material.opacity = 0.05 + (0.95 - 0.05) * eased;

                                if (progress >= 1) {
                                    documentMesh.userData.isEmerging = false;
                                    documentMesh.position.copy(documentMesh.userData.targetPosition);
                                    documentMesh.scale.setScalar(documentMesh.userData.originalScale);
                                    mainMesh.material.opacity = 0.95;
                                }
                            }
                        }
                    });
                }

                this.updateDebugInfo();
                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize the memory vault
        new IsoMemoryVault();
    </script>
</body>
</html>
